    "flexweek-service::appearance_preferences::appearance_fields_are_kept_and_going_back_to_the_defaults_drops_them",
    "flexweek-service::appearance_preferences::normal_motion_chosen_on_purpose_and_reduce_motion_are_kept",
    "flexweek-service::appearance_preferences::a_theme_pack_keeps_the_theme_on_its_own_light_or_dark_side",
