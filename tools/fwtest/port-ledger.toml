# The port ledger (2.0.0, Rust approved 2026-11-21). A Python test file (test_*.py or *_test.py
# under backend/tests/, desktop/tests/, scripts/rig/ or scripts/pictures/) is deleted only with a row
# here naming the Rust tests that replace it and how they were seen to fail (the rule broken by hand,
# or the mutation case that turned them red). `fwtest gate` refuses a deleted Python test file without
# a row, and a deleted ledger.
#
# [[port]]
# python = "desktop/tests/week/test_week_zoom.py"
# rust = ["flexweek-app::week::zoom_keeps_the_top_time"]
# red = "zoom's clamp removed by hand: zoom_keeps_the_top_time failed"

