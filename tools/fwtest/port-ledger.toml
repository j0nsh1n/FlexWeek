    "flexweek-service::accounts::tests::a_sign_in_checked_against_the_old_password_gets_no_session_after_a_change",
    "flexweek-service::accounts::tests::a_sign_in_checked_against_the_old_password_gets_no_session_after_a_recovery",
]
red = "dropping login's password re-check under the write lock fails both (2026-11-22)"
