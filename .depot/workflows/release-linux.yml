# The Linux downloads (tar.gz and AppImage) for a release, on Depot CI. Depot cannot start on
# "release published", so after publishing a release run it by hand with the tag:
#   depot ci dispatch --repo j0nsh1n/FlexWeek --workflow release-linux.yml --ref main --input tag=vX.Y.Z
# The Windows installers stay on GitHub Actions (.github/workflows/release-windows.yml), which has
# Windows runners and starts by itself when the release is published.
name: Release packages (Linux)

# Builds the Linux downloads and attaches them to the GitHub release named by `tag`. Pull
# requests that touch packaging, and a hand run without a tag, build and test everything but
# upload nothing to a release.
#
# onedir (not onefile): Qt plugins ship as a folder, so each bundle is a
# directory, installed on Windows and inside a tar.gz or AppImage on Linux.
# The window is native Qt widgets. Chromium is not in the package.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach packages to (e.g. v0.9.2). Leave empty to build this branch without uploading."
        required: false
  pull_request:
    paths:
      - "packaging/**"
      - "desktop/build_windows.ps1"
      - "desktop/build_linux.sh"
      - "desktop/package_linux.sh"
      - ".depot/workflows/release-linux.yml"

permissions:
  contents: write

jobs:
  linux:
    runs-on: depot-ubuntu-24.04 # was: ubuntu-24.04. Mapped standard GitHub runner to Depot equivalent.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python scripts/check_release_tag.py --tag="$TAG"

      - name: Install bundle tools and xcb helpers to vendor
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            patchelf binutils ccache libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxkbcommon0 libxkbcommon-x11-0 xvfb \
            libegl1 libgl1 libopengl0 libglx0 libgles2 libgl1-mesa-dri

      - name: Create venv and install build + runtime deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Install Rust
        run: |
          # Install the toolchain rust-toolchain.toml pins, with its rustfmt and clippy, before cargo runs: left
          # to cargo it was half-installed on the fly and failed ("cargo is not installed", a clippy conflict).
          # A broken copy already on the runner is removed and installed again once.
          pinned="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          install_pinned() {
            rustup toolchain install "$pinned" --profile minimal --component rustfmt,clippy --no-self-update \
              && rustup run "$pinned" cargo --version && rustup run "$pinned" cargo clippy --version
          }
          install_pinned || { rustup toolchain uninstall "$pinned"; install_pinned; }
          rustup default "$pinned"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: engine-build-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            engine-build-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Nuitka
            ~/.ccache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-desktop.txt') }}-${{ hashFiles('desktop/**') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-desktop.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Build the engine module
        run: .venv/bin/python -m maturin develop --release --manifest-path engine/py/Cargo.toml

      - name: Build and package Linux onedir
        run: |
          export NUITKA_CACHE_DIR="${HOME}/.cache/Nuitka"
          export CCACHE_DIR="${HOME}/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p "$NUITKA_CACHE_DIR" "$CCACHE_DIR"
          ./desktop/build_linux.sh
          ./desktop/package_linux.sh dist/FlexWeek dist/release

      - name: Smoke the packaged archive
        # Prove the download itself starts: extract the tarball a user gets and
        # run the root launcher, not the raw onedir. --smoke-test walks a new
        # account through setup to its first Solve and fails on a blank window.
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ""
        run: |
          mkdir dist/stage
          tar -xzf dist/release/FlexWeek-Linux-x86_64.tar.gz -C dist/stage
          if find dist/stage/FlexWeek dist/FlexWeek -name '*WebEngineCore*' | grep -q .; then
            echo "Native package must not ship WebEngine" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" dist/stage/FlexWeek/FlexWeek --smoke-test dist/packaged-smoke.json
          python -c 'import json,sys; r=json.load(open("dist/packaged-smoke.json")); print(r); sys.exit(0 if r.get("ok") and r.get("stage") == "week shown after setup Solve" else 1)'

      - name: Smoke the packaged helper in the archive
        # The download must carry the assistant helper and answer a read-only
        # request from it: the extracted launcher's --mcp dispatch, the seven
        # read tools and the sign-in refusal. A release is not done without it
        # (spec.md, Releases).
        run: |
          python desktop/smoke_mcp.py dist/stage/FlexWeek/FlexWeek --timeout 60

      - name: Smoke-test the setup Solve
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ""
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" dist/FlexWeek/FlexWeek --smoke-test dist/linux-smoke.json
          python -c 'import json,sys; r=json.load(open("dist/linux-smoke.json")); print(r); sys.exit(0 if r.get("ok") and r.get("stage") == "week shown after setup Solve" else 1)'

      - name: Build AppImage
        # Wraps the same onedir the tarball ships (LSA's packaging method).
        # appimagetool needs desktop-file-validate and mksquashfs; extract-and-
        # run mode avoids needing FUSE on the runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            desktop-file-utils squashfs-tools
          chmod +x packaging/make-appimage.sh
          packaging/make-appimage.sh dist/FlexWeek dist/release/FlexWeek-x86_64.AppImage
          test -x dist/release/FlexWeek-x86_64.AppImage
          size=$(stat -c%s dist/release/FlexWeek-x86_64.AppImage)
          echo "AppImage $size bytes"
          test "$size" -gt 1000000

      - name: Smoke the packaged helper in the AppImage
        # The AppImage dispatches --mcp before its library checks; the smoke
        # sets APPIMAGE_EXTRACT_AND_RUN so it starts without FUSE. It must
        # answer the same read-only exchange the archive's helper does.
        run: |
          python desktop/smoke_mcp.py dist/release/FlexWeek-x86_64.AppImage --timeout 60

      - name: Check the checksum files
        # Each .sha256 names only its file, so `sha256sum -c` works in whatever
        # folder the user downloaded to. 0.9.0's AppImage checksum held the
        # runner's /home/runner/work/... path instead.
        working-directory: dist/release
        run: |
          cat FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256
          if grep -q "/" FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256; then
            echo "A checksum file names a directory (such as /home/runner), not just the file." >&2
            exit 1
          fi
          sha256sum -c FlexWeek-Linux-x86_64.tar.gz.sha256 FlexWeek-x86_64.AppImage.sha256

      - name: Attach to the release
        if: github.event_name == 'release' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        # A file already on the release was checked by hand and may already be offered by the
        # updater, so it is never replaced. To replace one on purpose, delete it from the release first.
        run: |
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for file in \
            dist/release/FlexWeek-Linux-x86_64.tar.gz \
            dist/release/FlexWeek-Linux-x86_64.tar.gz.sha256 \
            dist/release/FlexWeek-x86_64.AppImage \
            dist/release/FlexWeek-x86_64.AppImage.sha256; do
            name=$(basename "$file")
            if grep -qxF "$name" <<< "$have"; then
              echo "$name is already on the release; leaving it as it is"
              continue
            fi
            gh release upload "$TAG" "$file"
          done
