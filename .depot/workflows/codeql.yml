# Depot CI Migration
# Source: .github/workflows/codeql.yml
#
# Changes made:
# - Rewrote .github/ path references to .depot/
# - Changed GitHub runs-on labels to their Depot equivalents

# CodeQL scans Python. It does not replace
# .depot/workflows/verify.yml. The generic kit CI (pyright, tests/ at repo
# root) is not used in this repository.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: python

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
