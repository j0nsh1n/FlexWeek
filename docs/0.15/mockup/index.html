<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FlexWeek 0.15 mock-up: Day, Week and Month in every design</title>
<style>
:root { --font: "Noto Sans", "Segoe UI", system-ui, sans-serif; --mono: "DejaVu Sans Mono", ui-monospace, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #1f2230; font-family: var(--font); color: #111; }
#switcher { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 8px 12px; background: #11131c; color: #cfd6e6; font-size: 13px; }
#switcher .group { display: flex; gap: 4px; align-items: center; }
#switcher button { background: #262a3a; color: #e8ecf6; border: 1px solid #3a4058; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
#switcher button.on { background: #e8ecf6; color: #11131c; border-color: #e8ecf6; font-weight: 700; }
#switcher .label { color: #8a93ad; margin-right: 2px; }
#about { padding: 6px 12px 8px; background: #11131c; color: #cfd6e6; font-size: 13px; border-top: 1px solid #262a3a; min-height: 40px; }
#about b { color: #fff; }
#about .risk { color: #f5b3b3; }
#frame { width: 1280px; height: 760px; margin: 10px auto; position: relative; overflow: hidden; border-radius: 8px; box-shadow: 0 10px 40px #0008; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
#top { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex: none; }
#top .title { font-weight: 800; font-size: 22px; min-width: 300px; }
#top .nav button, #top .tabs button, #top .plan { font: inherit; font-size: 14px; border-radius: 8px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
#top .tabs { margin-left: auto; display: flex; gap: 6px; }
#top .tabs button.on { font-weight: 800; outline: 2px solid var(--accent); }
#top .plan { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#stage { flex: 1; min-height: 0; position: relative; }
#status { flex: none; padding: 4px 12px 8px; font-size: 13px; min-height: 26px; color: var(--muted); }
#status.refused { color: var(--danger); font-weight: 700; }

/* Shared pieces */
.track { position: relative; touch-action: none; }
.blk { position: absolute; overflow: hidden; font-size: 12px; line-height: 1.25; padding: 3px 6px; cursor: grab; user-select: none; z-index: 2; }
.blk b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .t { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.one b, .blk.one .t { display: inline; }
.blk.one .t { margin-left: 6px; }
.blk.held { pointer-events: none; z-index: 6; }
.blk.ghost { opacity: .85; pointer-events: none; z-index: 6; }
.blk .dot { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); }
.blk.fixed { cursor: grab; }
.rule { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--line); pointer-events: none; }
.rule.half { border-top-style: dashed; opacity: .6; }
.vrule { position: absolute; top: 0; bottom: 0; width: 0; border-left: 1px solid var(--line); pointer-events: none; }
.vrule.half { border-left-style: dashed; opacity: .6; }
.hourlabel { position: absolute; font-size: 11px; color: var(--muted); pointer-events: none; }
.now { position: absolute; pointer-events: none; z-index: 4; background: var(--danger); }
.hint { position: absolute; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); border-radius: 6px; color: var(--accent); font-size: 12px; padding: 3px 8px; pointer-events: none; z-index: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; cursor: grab; user-select: none; font-size: 13px; touch-action: none; }
.floating { position: fixed; z-index: 100; pointer-events: none; padding: 6px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; box-shadow: 0 6px 18px #0005; }
.label-held { position: absolute; z-index: 7; pointer-events: none; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.label-held.refused { background: var(--danger); color: #fff; }
.scroller { overflow: auto; position: relative; }
.kicker { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

/* Month (shared shape, dressed per design) */
.month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: 28px repeat(6, 1fr); height: 100%; gap: 1px; padding: 0 12px 4px; }
.month .dn { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; align-self: center; text-transform: uppercase; }
.month .cell { background: var(--surface); padding: 4px 5px; overflow: hidden; cursor: pointer; position: relative; }
.month .cell.out { opacity: .45; }
.month .cell .n { font-size: 12px; font-weight: 700; margin-bottom: 2px; display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; }
.month .cell.today .n { background: var(--accent); color: var(--accent-ink); }
.month .cell.over { outline: 2px solid var(--accent); outline-offset: -2px; }
.mchip { display: block; font-size: 11.5px; padding: 1px 6px; margin: 2px 0; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; touch-action: none; }
.mchip.lifted { opacity: .35; }
.more { font-size: 11px; color: var(--muted); }

/* ---------- Today's app (Daily Scheduler) ---------- */
[data-design="classic"] { --bg: #edf2fa; --surface: #ffffff; --accent: #3d6fc4; --accent-ink: #fff; --text: #172033; --muted: #536079; --line: #e3e6eb; --danger: #c0262d; }
[data-design="classic"] .blk { border-radius: 5px; color: #0f172a; border-left: 4px solid var(--mark); background: var(--fill); }
[data-design="classic"] .blk.held { outline: 2px solid var(--accent); }
[data-design="classic"] .blk.refused { outline: 2px solid var(--danger); }
.cl-day { display: grid; grid-template-columns: 1fr 250px; height: 100%; gap: 0; }
.cl-day .main { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.cl-day .scroller { flex: 1; background: var(--surface); }
.cl-side { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.cl-side .chip { background: #fee2e2; border-left: 4px solid #ef4444; }
.cl-side .sumrow { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.cl-side .hintsmall { font-size: 11.5px; color: var(--muted); }
.cl-week { display: grid; grid-template-rows: 30px 1fr; height: 100%; padding: 0 12px 0 0; }
.cl-week .head { display: grid; grid-template-columns: 52px repeat(7, 1fr); }
.cl-week .head button { background: none; border: 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; border-radius: 6px; }
.cl-week .head button:hover { background: var(--surface); color: var(--text); }
.cl-week .head button.today { color: var(--accent); font-weight: 800; }
.cl-week .body { display: grid; grid-template-columns: 52px repeat(7, 1fr); min-height: 0; background: var(--surface); border-top: 1px solid var(--line); }
.cl-week .body .track { border-left: 1px solid var(--line); }
.gutter { position: relative; }

/* ---------- Timeline (editorial) ---------- */
[data-design="timeline"] { --bg: #f6f4ef; --surface: #ffffff; --accent: #1d1b16; --accent-ink: #f6f4ef; --text: #1d1b16; --muted: #5f594c; --line: #d9d3c4; --danger: #b3202a; }
[data-design="timeline"] .blk { background: #fff; border: 1px solid #1d1b16; border-left: 5px solid var(--mark); border-radius: 3px; color: #1d1b16; }
[data-design="timeline"] .blk.work { background: #1d1b16; color: #f6f4ef; border-color: #1d1b16; border-left-color: var(--mark); }
[data-design="timeline"] .blk.held { box-shadow: 4px 4px 0 #1d1b16; }
[data-design="timeline"] .blk.refused { border-color: var(--danger); }
.tl-day { display: grid; grid-template-columns: 1fr 210px; height: 100%; padding: 0 16px; gap: 18px; }
.tl-day h1, .tl-week h1 { font-size: 44px; margin: 0; letter-spacing: -.03em; font-weight: 900; }
.tl-pills { display: flex; gap: 6px; margin: 6px 0 8px; }
.tl-pills button { font: inherit; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.tl-pills button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tl-margin { border-left: 2px solid var(--text); padding: 60px 0 0 14px; display: flex; flex-direction: column; gap: 8px; }
.tl-margin .chip { background: #fff; border: 1px dashed var(--text); border-left: 4px solid #ef4444; }
.tl-ledger { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 100%; padding: 0 16px 8px; }
.tl-ledger .page { background: #fff; border: 1px solid var(--line); padding: 14px 16px; overflow: auto; }
.tl-ledger .page.left { border-right: 3px double var(--text); }
.tl-card { border: 1px solid var(--text); border-left: 5px solid var(--mark); padding: 6px 10px; margin: 6px 0; background: #fff; font-size: 13px; }
.tl-card .tm { font-weight: 800; margin-right: 8px; }
.tl-now { color: var(--danger); font-weight: 800; font-size: 12px; margin: 8px 0; border-top: 2px solid var(--danger); padding-top: 2px; }
.tl-week { height: 100%; display: flex; flex-direction: column; padding: 0 16px 6px; }
.tl-section { display: grid; grid-template-columns: 170px 1fr; align-items: center; border-bottom: 1px solid var(--line); padding: 4px 0; }
.tl-section .dname { font-size: 24px; font-weight: 900; letter-spacing: -.02em; cursor: pointer; }
.tl-section .dname small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.tl-section .track { height: 56px; }
.tl-section.today .dname { text-decoration: underline 4px var(--danger); }

/* ---------- Mission control (HUD) ---------- */
[data-design="mission"] { --bg: #070b12; --surface: #0d1524; --accent: #4ee6c4; --accent-ink: #04101c; --text: #e6eefb; --muted: #9fb0c8; --line: #22304a; --danger: #ff4d6d; font-family: var(--mono); }
[data-design="mission"] #top .title { font-family: var(--font); }
[data-design="mission"] .blk { background: var(--fill-dark); border: 1px solid var(--mark); color: #e6eefb; border-radius: 2px; font-family: var(--mono); }
[data-design="mission"] .blk.held { box-shadow: 0 0 0 2px var(--accent), 0 0 18px var(--accent); }
[data-design="mission"] .blk.refused { box-shadow: 0 0 0 2px var(--danger), 0 0 18px var(--danger); }
.mc { display: grid; grid-template-columns: 1fr 270px; gap: 12px; padding: 0 12px 8px; height: 100%; }
.mc .panel { background: var(--surface); border: 1px solid var(--line); padding: 10px; overflow: auto; }
.mc .panel h4 { margin: 0 0 8px; font-size: 11px; letter-spacing: .12em; color: var(--accent); }
.mc .chip { background: #0a1b24; border: 1px solid var(--accent); color: var(--text); font-family: var(--mono); font-size: 12px; margin: 3px 0; }
.mc .ruler { position: relative; height: 22px; border-bottom: 1px solid var(--line); }
.mc .ruler span { position: absolute; font-size: 10px; color: var(--muted); transform: translateX(-50%); top: 4px; }
.mc .lanes { display: grid; grid-template-columns: 72px 1fr; }
.mc .lane-name { font-size: 11px; color: var(--muted); display: flex; align-items: center; cursor: pointer; }
.mc .lane-name.today { color: var(--accent); }
.mc .lanes .track { height: 62px; border-bottom: 1px solid var(--line); background: repeating-linear-gradient(90deg, transparent 0 calc(100%/17 - 1px), var(--line) calc(100%/17 - 1px) calc(100%/17)); }
.mc .scope .track { height: 300px; border: 1px solid var(--line); background: repeating-linear-gradient(90deg, transparent 0 calc(100%/68 - 1px), #16233a calc(100%/68 - 1px) calc(100%/68)); }
.mc .hudline { font-size: 11px; color: var(--muted); display: flex; gap: 18px; margin: 4px 0 8px; }
.mc .hudline b { color: var(--accent); }
.mc .tape { display: grid; grid-template-columns: 70px 1fr; }
.mc .cols { display: grid; grid-template-columns: 60px repeat(7, 1fr); }
.mc .cols .track { border-left: 1px solid var(--line); }

/* ---------- Bento (tiles) ---------- */
[data-design="bento"] { --bg: #eef2ff; --surface: #ffffff; --accent: #4f46e5; --accent-ink: #fff; --text: #1e1b4b; --muted: #4b4a75; --line: #e0e7ff; --danger: #991b1b; }
[data-design="bento"] .blk { background: var(--fill); border-radius: 10px; color: #1e1b4b; border-left: 4px solid var(--mark); }
[data-design="bento"] .blk.held { box-shadow: 0 8px 24px #4f46e555; outline: 2px solid var(--accent); }
[data-design="bento"] .blk.refused { outline: 2px solid var(--danger); }
.bn { display: grid; gap: 14px; padding: 4px 18px 10px; height: 100%; }
.bn .tile { background: #fff; border-radius: 20px; padding: 14px 16px; min-height: 0; display: flex; flex-direction: column; box-shadow: 0 2px 8px #1e1b4b0d; }
.bn .tile.hero { background: var(--accent); color: #fff; }
.bn .tile.hero .kicker { color: #e0e7ff; }
.bn .tile.hero .track { background: #ffffff14; border-radius: 12px; }
.bn .tile.hero .rule { border-color: #ffffff26; }
.bn .tile.hero .hourlabel { color: #e0e7ffcc; }
.bn .chip { background: #fee2e2; border-left: 4px solid #ef4444; border-radius: 10px; margin: 4px 0; }
.bn h2 { margin: 4px 0 8px; font-size: 22px; }
.bn .cols7 { display: grid; grid-template-columns: 44px repeat(7, 1fr); gap: 4px; flex: 1; min-height: 0; }
.bn .cols7 .dhead { font-size: 12px; text-align: center; color: #e0e7ff; font-weight: 700; cursor: pointer; }

/* ---------- Retro desktop ---------- */
[data-design="retro"] { --bg: #008080; --surface: #c0c0c0; --accent: #000080; --accent-ink: #fff; --text: #000; --muted: #333; --line: #808080; --danger: #a00000; font-family: "DejaVu Sans", Tahoma, sans-serif; }
[data-design="retro"] #top .nav button, [data-design="retro"] #top .tabs button, [data-design="retro"] #top .plan { border-radius: 0; border: 2px outset #dfdfdf; background: #c0c0c0; color: #000; }
[data-design="retro"] #top .plan { background: #000080; color: #fff; }
[data-design="retro"] #top .title { color: #fff; }
[data-design="retro"] #status { color: #fff; }
[data-design="retro"] .blk { background: #c0c0c0; border: 2px outset #efefef; border-left: 5px solid var(--mark); border-radius: 0; color: #000; font-size: 11.5px; }
[data-design="retro"] .blk.held { border: 2px inset #efefef; border-left: 5px solid var(--mark); background: #d4d0c8; }
[data-design="retro"] .blk.refused { background: #ffd0d0; }
.win { position: absolute; background: #c0c0c0; border: 2px outset #efefef; display: flex; flex-direction: column; box-shadow: 1px 1px 0 #000; }
.win .bar { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-weight: 700; font-size: 12px; padding: 3px 6px; display: flex; justify-content: space-between; }
.win .bar i { font-style: normal; background: #c0c0c0; color: #000; border: 1px outset #fff; padding: 0 5px; font-size: 10px; }
.win .menu { font-size: 12px; padding: 2px 6px; }
.win .sunken { background: #fff; border: 2px inset #efefef; margin: 3px; flex: 1; min-height: 0; }
.win .statusbar { font-size: 11.5px; border: 1px inset #efefef; margin: 0 3px 3px; padding: 1px 6px; min-height: 18px; }
.win .chip { background: #fff; border-radius: 0; font-family: var(--mono); font-size: 12px; padding: 2px 6px; display: flex; }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; background: #c0c0c0; border-top: 2px outset #efefef; display: flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 12px; }
.taskbar .start { font-weight: 800; border: 2px outset #efefef; padding: 2px 8px; }
.taskbar .tray { margin-left: auto; border: 1px inset #efefef; padding: 2px 6px; display: flex; gap: 6px; align-items: center; }
.taskbar .tray .chip { padding: 1px 6px; background: #fff; border: 1px solid #808080; border-radius: 0; font-size: 11px; }
.desk-icons .blk { text-align: center; background: #c0c0c0cc; }

/* ---------- Clay deck ---------- */
[data-design="clay"] { --bg: #f3ecff; --surface: #ffffff; --accent: #3a2f4d; --accent-ink: #fff; --text: #3a2f4d; --muted: #4a3f5e; --line: #e3d9f5; --danger: #9b1c4a; }
[data-design="clay"] .blk { background: var(--fill); border-radius: 14px; border: 3px solid #fff; color: #3a2f4d; box-shadow: inset -3px -3px 6px #0000001a, 3px 4px 10px #3a2f4d26; }
[data-design="clay"] .blk.held { transform: scale(1.04); box-shadow: inset -3px -3px 6px #0000001a, 6px 10px 22px #3a2f4d44; }
[data-design="clay"] .blk.refused { border-color: var(--danger); }
.cy { height: 100%; padding: 4px 18px 10px; display: flex; flex-direction: column; }
.cy h2 { margin: 2px 0 6px; font-size: 22px; }
.cy .card { background: #fff; border-radius: 26px; border: 4px solid #fff; box-shadow: inset -6px -6px 14px #3a2f4d14, 8px 12px 28px #3a2f4d22; padding: 14px; position: relative; }
.cy .dish { background: #fff; border-radius: 22px; padding: 12px; box-shadow: inset 4px 4px 10px #3a2f4d1a; display: flex; flex-direction: column; gap: 8px; }
.cy .chip { background: #fdbcb4; border-radius: 999px; border: 3px solid #fff; box-shadow: 2px 3px 8px #3a2f4d26; }
.cy .felt { background: radial-gradient(circle at 30% 20%, #cdeccf, #a9d8b3); border-radius: 26px; box-shadow: inset 0 0 40px #0000001f; }
.cy .felt .rule { border-color: #ffffff80; }
.cy .felt .hourlabel { color: #2d5a3a; }
.cy .fan { position: relative; flex: 1; }
.cy .fan .card { position: absolute; top: 20px; width: 170px; height: 480px; padding: 26px 8px 8px; transform-origin: center; }
.cy .fan .card .dn { position: absolute; top: 6px; left: 12px; font-weight: 800; font-size: 14px; cursor: pointer; }
.cy .fan .card.today { top: 0; width: 200px; height: 540px; z-index: 3; }
.cy .row7 { display: grid; grid-template-columns: 46px repeat(7, 1fr); gap: 10px; flex: 1; min-height: 0; }
.cy .row7 .card { padding: 26px 6px 6px; }
.cy .row7 .card .dn { position: absolute; top: 5px; left: 12px; font-weight: 800; font-size: 13px; cursor: pointer; }
.cy .deckcorner { position: absolute; right: 10px; top: 40px; width: 230px; height: 160px; }
.cy .deckcorner .chip { position: absolute; }
</style>
</head>
<body>
<div id="switcher"></div>
<div id="about"></div>
<div id="frame" data-design="classic">
  <div id="top">
    <div class="title" id="title"></div>
    <div class="nav"><button>‹</button> <button>›</button> <button>Today</button></div>
    <div class="tabs" id="tabs"></div>
    <button class="plan">Plan my homework</button>
  </div>
  <div id="stage"></div>
  <div id="status"></div>
</div>
<script>
"use strict";
const DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const WEEK0 = 21;                       // Monday 21 September 2026
const NOW = { dom: 24, min: 15 * 60 + 40 };
const FROM = 6 * 60, TO = 23 * 60, SNAP = 15;
const CATS = {
  class: ["#bfdbfe", "#3b82f6", "#10233f"], assignments: ["#fecaca", "#ef4444", "#3f1414"],
  exercise: ["#a7f3d0", "#10b981", "#0f3326"], extra: ["#fbcfe8", "#ec4899", "#3f1230"],
  meals: ["#fed7aa", "#f97316", "#3f2410"], study: ["#ddd6fe", "#8b5cf6", "#241545"], free: ["#e2e8f0", "#94a3b8", "#1e293b"],
};
let uid = 1;
function B(title, cat, dom, start, end, extra = {}) { return { id: "b" + uid++, title, cat, dom, start, end, ...extra }; }
function seed() {
  const blocks = [];
  for (let d = 21; d <= 25; d++) blocks.push(B("School", "class", d, 8 * 60, 14 * 60 + 30, { fixed: true, series: "school" }));
  for (const d of [22, 24]) blocks.push(B("Soccer", "exercise", d, 16 * 60, 17 * 60 + 30, { fixed: true, series: "soccer" }));
  for (let d = 21; d <= 27; d++) blocks.push(B("Dinner", "meals", d, 18 * 60, 18 * 60 + 45, { fixed: true, series: "dinner" }));
  blocks.push(B("Piano", "extra", 21, 17 * 60, 17 * 60 + 45, { fixed: true }));
  blocks.push(B("History essay", "assignments", 24, 19 * 60, 20 * 60, { work: true, pinned: true }));
  blocks.push(B("Reading log", "assignments", 22, 19 * 60 + 30, 20 * 60 + 15, { work: true }));
  blocks.push(B("Chem lab report", "assignments", 26, 10 * 60, 11 * 60 + 30, { work: true }));
  return blocks;
}
const S = {
  design: "classic", tab: "day", day: 3, concept: {}, blocks: seed(),
  tray: [ { id: "t1", title: "Math worksheet", minutes: 60, due: 27 * 1440 + 23 * 60 + 59 },
          { id: "t2", title: "Science poster", minutes: 60, due: 25 * 1440 + 23 * 60 + 59 },
          { id: "t3", title: "Spanish vocab", minutes: 30, due: 26 * 1440 + 23 * 60 + 59 } ],
  preview: null, drag: null, msg: "", msgBad: false,
};

// ---------- Concepts: what each design's Day and Week are ----------
const CONCEPTS = {
  classic: {
    day: { A: ["Daily Scheduler's day", "One full-width day at 96 px an hour that scrolls, with Not placed yet and a summary in the sidebar, as in Daily Scheduler. Drag, resize from an edge, drag empty time to add, or drag homework in from the sidebar.", ""] },

    h(`<div class="cy"><div style="display:flex;gap:10px;align-items:center"><h2 style="margin:0">Your week, fanned</h2><span class="kicker" style="color:var(--text)">No time yet:</span>${trayChips()}</div>
       <div class="fan">${DAYN.map((n, i) => `<div class="card ${WEEK0 + i === NOW.dom ? "today" : ""}" id="c${i}" style="left:${lefts[i]}px;transform:rotate(${angles[i]}deg);background:${["#fdbcb4", "#add8e6", "#c9f7d0", "#ffffff", "#fde68a", "#e6e6fa", "#fbcfe8"][i]}"><div class="dn" data-open="${WEEK0 + i}">${n} ${WEEK0 + i}</div><div id="d${i}" style="height:100%"></div></div>`).join("")}</div></div>`);
    DAYN.forEach((n, i) => { const t = track(q("#d" + i), WEEK0 + i, "v", FROM, TO, angles[i]); rules(t); nowMark(t); });
  },
  "clay:week:B"() {
    h(`<div class="cy"><h2>Your week, laid flat</h2><div class="row7"><div id="g" style="margin-top:26px"></div>${DAYN.map((n, i) => `<div class="card" style="background:${["#fdbcb4", "#add8e6", "#c9f7d0", "#ffffff", "#fde68a", "#e6e6fa", "#fbcfe8"][i]}"><div class="dn" data-open="${WEEK0 + i}">${n} ${WEEK0 + i}</div><div id="d${i}" style="height:100%"></div></div>`).join("")}</div>
       <div style="display:flex;gap:10px;align-items:center;margin-top:10px"><span class="kicker" style="color:var(--text)">The deck, no time yet:</span>${trayChips()}</div></div>`);
    gutter(q("#g"), FROM, TO, 120); DAYN.forEach((n, i) => vDay(q("#d" + i), WEEK0 + i));
  },
};
function monthSurface() {
  const first = new Date(2026, 8, 1), lead = (first.getDay() + 6) % 7;
  let cells = DAYN.map(n => `<div class="dn">${n}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = i - lead + 1, inMonth = d >= 1 && d <= 30, domv = inMonth ? d : null;
    const list = inMonth ? S.blocks.filter(b => b.dom === d).sort((a, b) => a.start - b.start) : [];
    const shown = list.slice(0, 4).map(b => { const [fill, mark, dark] = CATS[b.cat] || CATS.free; const dk = S.design === "mission"; return `<span class="mchip" data-id="${b.id}" style="background:${dk ? dark : fill};${dk ? "color:#e6eefb;border-left:3px solid " + mark : "border-left:3px solid " + mark}">${hhmm(b.start)} ${b.title}</span>`; }).join("");
    const num = inMonth ? d : d < 1 ? 31 + d : d - 30;
    cells += `<div class="cell ${inMonth ? "" : "out"} ${d === NOW.dom ? "today" : ""}" ${inMonth ? `data-dom="${d}"` : ""}><span class="n">${num}</span>${shown}${list.length > 4 ? `<div class="more">+${list.length - 4} more</div>` : ""}</div>`;
  }
  h(`<div class="month">${cells}</div>`);
  const style = { retro: "border:2px outset #efefef;border-radius:0", clay: "border-radius:16px;box-shadow:inset -3px -3px 8px #3a2f4d14", bento: "border-radius:14px", mission: "border:1px solid #22304a", timeline: "border:1px solid #d9d3c4", classic: "" }[S.design];
  qa(".cell").forEach(c => c.style.cssText += style);
}

// ---------- Frame ----------
function concept() { const k = S.design + ":" + S.tab; const have = CONCEPTS[S.design][S.tab]; if (!have) return null; if (!S.concept[k] || !have[S.concept[k]]) S.concept[k] = "A"; return S.concept[k]; }
function retitle() {
  const t = document.getElementById("title");
  t.textContent = S.tab === "day" ? `${FULL[S.day]} ${WEEK0 + S.day} September` : S.tab === "week" ? "21 – 27 September" : "September 2026";
}
let lastKey = "", kept = {};
function render() {
  const key = `${S.design}:${S.tab}:${S.day}:${S.concept[S.design + ":" + S.tab] || "A"}`;
  kept = {}; if (key === lastKey) document.querySelectorAll("#stage .scroller").forEach((sc, i) => kept[i] = [sc.scrollTop, sc.scrollLeft]);
  TRACKS = []; clearHint();
  document.getElementById("frame").dataset.design = S.design;
  retitle();
  document.getElementById("tabs").innerHTML = ["day", "week", "month"].map(t => `<button data-tab="${t}" class="${S.tab === t ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("");
  let about;
  if (S.tab === "month") { monthSurface(); about = MONTH_ABOUT; }
  else { const c = concept(); SURFACES[`${S.design}:${S.tab}:${c}`](); about = CONCEPTS[S.design][S.tab][c]; }
  drawAll();
  if (key === lastKey) document.querySelectorAll("#stage .scroller").forEach((sc, i) => { if (kept[i]) { sc.scrollTop = kept[i][0]; sc.scrollLeft = kept[i][1]; } });
  lastKey = key;
  const c = S.tab === "month" ? null : concept();
  const variants = S.tab === "month" ? [] : Object.keys(CONCEPTS[S.design][S.tab]);
  document.getElementById("switcher").innerHTML =
    `<div class="group"><span class="label">Design</span>${Object.keys(CONCEPTS).map((d, i) => `<button data-design="${d}" class="${S.design === d ? "on" : ""}">${i + 1} ${{ classic: "Today's app", timeline: "Timeline", mission: "Mission control", bento: "Bento", retro: "Retro desktop", clay: "Clay deck" }[d]}</button>`).join("")}</div>
     <div class="group"><span class="label">Tab</span>${["day", "week", "month"].map(t => `<button data-tab="${t}" class="${S.tab === t ? "on" : ""}">${t[0].toUpperCase()}${t.slice(1)}</button>`).join("")}</div>
     ${variants.length > 1 ? `<div class="group"><span class="label">Concept</span>${variants.map(v => `<button data-concept="${v}" class="${c === v ? "on" : ""}">${v} · ${CONCEPTS[S.design][S.tab][v][0]}</button>`).join("")}</div>` : ""}
     <div class="group"><button id="reset">Reset the week</button></div>`;
  document.getElementById("about").innerHTML = `<b>${about[0]}.</b> ${about[1]}` + (about[2] ? ` <span class="risk">Watch: ${about[2]}</span>` : "") + `<br><span style="color:#8a93ad">Try: drag a block, pull its top or bottom edge, drag across empty time, drag homework in from the tray. Keys: 1-6 design, D W M tab, A B concept, Esc lets go.</span>`;
}
function setTab(t) { S.tab = t; render(); }
function setDesign(d) { if (d) { S.design = d; render(); } }
document.addEventListener("click", e => {
  const d = e.target.closest("[data-design]"), t = e.target.closest("[data-tab]"), c = e.target.closest("[data-concept]"), o = e.target.closest("[data-open]");
  if (e.target.id === "reset") { S.blocks = seed(); S.tray = [{ id: "t1", title: "Math worksheet", minutes: 60, due: 27 * 1440 + 23 * 60 + 59 }, { id: "t2", title: "Science poster", minutes: 60, due: 25 * 1440 + 23 * 60 + 59 }, { id: "t3", title: "Spanish vocab", minutes: 30, due: 26 * 1440 + 23 * 60 + 59 }]; say(""); render(); return; }
  if (d && d.id !== "frame") setDesign(d.dataset.design);
  else if (t) setTab(t.dataset.tab);
  else if (c) { S.concept[S.design + ":" + S.tab] = c.dataset.concept; render(); }
  else if (o) openDay(+o.dataset.open);
});
document.addEventListener("dblclick", e => { const b = e.target.closest(".blk"); if (b) say(`${S.blocks.find(x => x.id === b.dataset.id)?.title}: in FlexWeek a double-click opens its editor.`); });
const params = new URLSearchParams(location.search);
if (params.get("design")) S.design = params.get("design");
if (params.get("tab")) S.tab = params.get("tab");
if (params.get("concept")) S.concept[S.design + ":" + S.tab] = params.get("concept");
render();
window.__mock = { S, render, TRACKS: () => TRACKS };
</script>
