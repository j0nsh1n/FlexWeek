<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlexWeek look concepts (mock-up)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amatic+SC:wght@700&family=Anton&family=Bebas+Neue&family=Caveat:wght@500;700&family=DM+Sans:wght@400;500;700&family=Epilogue:wght@400;700;900&family=Figtree:wght@400;600;700&family=Fira+Code:wght@400;600&family=Fira+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Newsreader:wght@400;600;800&family=Nunito:wght@400;700;800&family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&family=Press+Start+2P&family=Quicksand:wght@500;700&family=Roboto:wght@400;500;700&family=Share+Tech+Mono&family=Source+Sans+3:wght@400;600&family=Space+Grotesk:wght@500;700&family=VT323&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* A throwaway mock-up. One sample week, nine ways of showing it. No backend, no product code. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 system-ui, "Segoe UI", sans-serif; background: #111; color: #eee; display: flex; flex-direction: column; }
#switcher { display: flex; gap: 6px; padding: 8px 10px; background: #0b0b0d; border-bottom: 1px solid #2a2a30; flex-wrap: wrap; align-items: center; }
#switcher b { color: #9aa; font-weight: 600; margin-right: 6px; letter-spacing: .04em; font-size: 12px; text-transform: uppercase; }
#switcher button { font: inherit; font-size: 13px; color: #cfd3dc; background: #1a1b20; border: 1px solid #30323a; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
#switcher button kbd { font: 11px ui-monospace, monospace; opacity: .6; margin-right: 5px; }
#switcher button[aria-pressed="true"] { background: #e8eaf0; color: #111; border-color: #e8eaf0; font-weight: 700; }
#stage { flex: 1; min-height: 0; overflow: auto; position: relative; }
#notes { background: #0b0b0d; border-top: 1px solid #2a2a30; padding: 8px 12px; font-size: 12.5px; color: #c4c8d4; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
#notes b { color: #fff; display: block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
#pop { position: fixed; z-index: 50; width: 260px; background: #fff; color: #111; border-radius: 10px; padding: 12px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.45); font: 13px/1.4 system-ui, sans-serif; }
#pop h4 { margin: 0 0 4px; font-size: 15px; } #pop p { margin: 2px 0; color: #444; }
#pop .row { display: flex; gap: 6px; margin-top: 10px; } #pop button { font: inherit; border: 1px solid #ccc; background: #f4f4f6; border-radius: 6px; padding: 4px 9px; cursor: pointer; }
[data-id], button { cursor: pointer; }

/* 1. FROST: today's app, for comparison */
.frost { font-family: Figtree, system-ui, sans-serif; min-height: 100%; background: #0e1320 linear-gradient(160deg, #0e1320, #171a2e); color: #e6ebf5; display: grid; grid-template-rows: auto 1fr; }
.frost .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(26,33,49,.7); border-bottom: 1px solid rgba(186,204,255,.12); }
.frost .top h1 { font-size: 17px; margin: 0; flex: 1; } .frost .btn { background: #7fa8ff; color: #0b1224; border: 0; border-radius: 5px; padding: 6px 12px; font-weight: 600; }
.frost .body { display: grid; grid-template-columns: 1fr 280px; min-height: 0; }
.frost .grid { display: grid; grid-template-columns: 44px repeat(7, 1fr); position: relative; padding: 0 8px 8px; }
.frost .dh { text-align: center; font-size: 12px; padding: 6px 0; color: #9ba6ba; border-bottom: 1px solid rgba(186,204,255,.12); } .frost .dh.today { color: #7fa8ff; font-weight: 700; }
.frost .col { position: relative; height: 448px; border-left: 1px solid rgba(186,204,255,.07); background: repeating-linear-gradient(#131a27 0 27px, rgba(186,204,255,.07) 27px 28px); }
.frost .hrs { position: relative; height: 448px; font-size: 11px; color: #9ba6ba; } .frost .hrs span { position: absolute; right: 6px; transform: translateY(-50%); }
.frost .blk { position: absolute; left: 3px; right: 3px; border-radius: 4px; padding: 2px 5px; font-size: 11px; overflow: hidden; background: #2b3a52; border-left: 4px solid var(--c); }
.frost .blk.work { background: #4a3c1c; color: #fff4dc; } .frost .side { border-left: 1px solid rgba(186,204,255,.12); padding: 12px; background: rgba(26,33,49,.66); }
.frost .side h3 { font-size: 13px; margin: 0 0 6px; } .frost .chip { display: inline-block; font-size: 11px; border: 1px solid rgba(186,204,255,.24); border-left: 3px solid var(--c); border-radius: 3px; padding: 2px 7px; margin: 0 4px 4px 0; }
.frost .task { background: rgba(34,42,61,.94); border: 1px solid rgba(186,204,255,.12); border-left: 3px solid var(--c); border-radius: 5px; padding: 6px 8px; margin-bottom: 6px; font-size: 12px; }

/* 2. TERMINAL: no buttons, a text week and a command line */
.tui { min-height: 100%; background: #000; color: #9fe89f; font: 13px/1.35 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 0 22px; align-content: start; }
.tui pre { margin: 0; font: inherit; } .tui .bar { grid-column: 1 / -1; background: #9fe89f; color: #000; padding: 1px 8px; margin-bottom: 8px; display: flex; justify-content: space-between; font-weight: 700; }
.tui .dim { color: #5fa85f; } .tui .amb { color: #ffb000; } .tui .red { color: #ff6b6b; } .tui .cy { color: #6fd6ff; } .tui .vi { color: #c9a4ff; } .tui .or { color: #ffa45c; } .tui .pk { color: #ff8fc8; }
.tui .cmd { grid-column: 1 / -1; margin-top: 10px; border-top: 1px solid #2f5f2f; padding-top: 6px; } .tui .cur { background: #9fe89f; color: #000; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } } .tui h5 { margin: 0 0 4px; font: inherit; color: #ffb000; }

/* 3. CORKBOARD: no time grid, pinned notes */
.board { min-height: 100%; padding: 16px; background: #b98a57; background-image: radial-gradient(rgba(60,35,10,.35) 1px, transparent 1.5px), radial-gradient(rgba(255,220,170,.25) 1px, transparent 1.5px); background-size: 9px 9px, 13px 13px; background-position: 0 0, 4px 6px; font-family: Caveat, "Bradley Hand", "Segoe Print", cursive; color: #2b2116; }
.board .cols { display: grid; grid-template-columns: repeat(7, 1fr) 1.15fr; gap: 12px; align-items: start; }
.board h3 { margin: 0 0 8px; font-size: 22px; color: #fff6e3; background: #2b2116; display: inline-block; padding: 0 10px; border-radius: 4px; } .board h3.today { text-decoration: underline wavy #ffe36e; }
.board .note { position: relative; padding: 14px 10px 10px; margin: 0 0 12px; font-size: 18px; line-height: 1.15; box-shadow: 2px 5px 10px rgba(0,0,0,.35); background: var(--c); transform: rotate(var(--r)); }
.board .note::before { content: ""; position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a8a, #b01818); box-shadow: 0 2px 3px rgba(0,0,0,.5); }
.board .note.card { background: #fffdf5; border-top: 14px solid #d94a4a; font-family: Quicksand, system-ui, sans-serif; font-size: 13px; line-height: 1.35; } .board .note small { display: block; opacity: .85; font-size: 14px; }
.board .note .due { display: inline-block; margin-top: 4px; border: 2px solid #7a0c0c; color: #7a0c0c; padding: 0 5px; font: 700 11px/1.5 "JetBrains Mono", ui-monospace, monospace; transform: rotate(-4deg); text-transform: uppercase; }
.board .note.done { text-decoration: line-through; background: #ddd5c0; } .board .tray { background: rgba(40,24,8,.35); border: 2px dashed rgba(255,246,227,.6); border-radius: 8px; padding: 10px; }

/* 4. TIMELINE RIVER: now, next, later */
.river { min-height: 100%; background: #f6f4ef; color: #1d1b16; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
.river .wrap { max-width: 720px; margin: 0 auto; padding: 22px 20px 40px; } .river h1 { font-size: 44px; margin: 0; letter-spacing: -.03em; } .river .sub { color: #5f594c; margin-bottom: 14px; }
.river .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 22px; } .river .heat div { border-radius: 8px; padding: 6px 8px; font-size: 11px; background: #e9e4d8; } .river .heat .today { outline: 2px solid #1d1b16; }
.river .heat i { display: block; height: 5px; border-radius: 3px; background: #1d1b16; margin-top: 5px; }
.river .rail { position: relative; padding-left: 86px; } .river .rail::before { content: ""; position: absolute; left: 68px; top: 0; bottom: 0; width: 3px; background: #d9d2c0; border-radius: 2px; }
.river .ev { position: relative; margin-bottom: 12px; background: #fff; border-radius: 14px; padding: 11px 14px; box-shadow: 0 1px 0 #e4ddcb; } .river .ev::before { content: ""; position: absolute; left: -25px; top: 16px; width: 13px; height: 13px; border-radius: 50%; background: var(--c); border: 3px solid #f6f4ef; }
.river .ev time { position: absolute; left: -86px; top: 12px; width: 52px; text-align: right; font-weight: 700; font-size: 13px; background: #f6f4ef; } .river .ev.past { color: #5f594c; } .river .ev.past b { font-weight: 500; } .river .ev small { color: #5f594c; display: block; }
.river .ev.next { background: #1d1b16; color: #fff; padding: 18px; } .river .ev.next time { color: #1d1b16; } .river .ev.next h2 { margin: 2px 0 4px; font-size: 24px; } .river .ev.next small { color: #c9c2b0; } .river .ev.next button { margin-top: 10px; border: 0; border-radius: 999px; padding: 8px 16px; font-family: inherit; font-weight: 700; font-size: 13px; background: #ffd84d; display: block; color: #1d1b16; }
.river .now { position: relative; margin: 4px 0 14px; } .river .now span { position: relative; left: -86px; background: #c2303a; color: #fff; font-weight: 700; font-size: 12px; border-radius: 999px; padding: 2px 9px; }

/* 5. MISSION CONTROL: time runs sideways */
.control { min-height: 100%; background: #070b12; color: #b9c7dc; font: 12px/1.35 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; display: grid; grid-template: "rail head head" auto "rail gantt side" 1fr "rail log side" auto / 46px 1fr 280px; gap: 1px; background-color: #182234; }
.control > * { background: #070b12; padding: 10px 12px; } .control .railnav { grid-area: rail; display: flex; flex-direction: column; gap: 14px; align-items: center; padding-top: 14px; font-size: 17px; } .control .railnav svg { width: 20px; height: 20px; } .control .railnav svg:first-child { color: #4ee6c4; }
.control .head { grid-area: head; display: flex; gap: 22px; align-items: baseline; } .control .head b { color: #fff; font-size: 14px; letter-spacing: .08em; } .control .head em { font-style: normal; color: #4ee6c4; font: 600 13px ui-monospace, monospace; }
.control .gantt { grid-area: gantt; } .control .axis, .control .lane { display: grid; grid-template-columns: 74px 1fr; align-items: center; } .control .axis div:last-child { position: relative; height: 16px; font: 11px "Share Tech Mono", ui-monospace, monospace; color: #8aa0c4; } .control .axis span { position: absolute; transform: translateX(-50%); }
.control .lane { margin: 7px 0; } .control .lane > b { font: 600 11px ui-monospace, monospace; color: #7f93b4; } .control .lane.today > b { color: #4ee6c4; }
.control .track { position: relative; height: 34px; background: repeating-linear-gradient(90deg, #0d1422 0, #0d1422 calc(6.25% - 1px), #182234 calc(6.25% - 1px), #182234 6.25%); border-radius: 3px; }
.control .bar { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; background: color-mix(in srgb, var(--c) 30%, #070b12); border: 1px solid var(--c); color: #fff; font-size: 10.5px; padding: 3px 5px; overflow: hidden; white-space: nowrap; }
.control .bar.work { background: var(--c); color: #04101c; font-weight: 700; } .control .nowline { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #ff4d6d; box-shadow: 0 0 8px #ff4d6d; }
.control .side { grid-area: side; } .control h4 { margin: 0 0 8px; font: 400 12px "Share Tech Mono", ui-monospace, monospace; letter-spacing: .12em; color: #8aa0c4; text-transform: uppercase; }
.control .risk { margin-bottom: 9px; } .control .risk i { display: block; height: 4px; border-radius: 2px; margin-top: 4px; background: linear-gradient(90deg, var(--c) var(--p), #182234 var(--p)); } .control .risk span { float: right; font: 10.5px ui-monospace, monospace; }
.control .load { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; align-items: end; height: 64px; margin-bottom: 4px; } .control .load div { background: #2b6cff; border-radius: 2px 2px 0 0; } .control .load div.today { background: #4ee6c4; }
.control .log { grid-area: log; font: 11px/1.5 ui-monospace, monospace; color: #8aa0c4; } .control .log b { color: #4ee6c4; font-weight: 400; } .control .log u { color: #ff4d6d; text-decoration: none; }

/* 6. BULLET JOURNAL: dotted paper, a two-page spread */
.journal { min-height: 100%; background: #e9e2d2; padding: 18px; font-family: Caveat, "Bradley Hand", "Segoe Print", cursive; color: #26313f; }
.journal .spread { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; background: #fbf8f0; background-image: radial-gradient(#b9b3a4 1px, transparent 1.2px); background-size: 18px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25), inset 0 0 0 1px #d9d2c0; position: relative; }
.journal .spread::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 26px; transform: translateX(-50%); background: linear-gradient(90deg, transparent, rgba(0,0,0,.13), transparent); }
.journal .page { padding: 22px 30px 26px; } .journal h1 { font: 700 46px/1 "Amatic SC", Caveat, cursive; margin: 0 0 4px; } .journal .tape { display: inline-block; background: #f6b8c6 repeating-linear-gradient(45deg, #f6b8c6 0 8px, #fbd3dc 8px 16px); padding: 1px 16px; transform: rotate(-2deg); margin-bottom: 12px; font-size: 15px; }
.journal h3 { font: 700 30px/1 "Amatic SC", Caveat, cursive; margin: 14px 0 3px; display: inline-block; border-bottom: 3px solid var(--u, #26313f); border-radius: 0 0 40% 60% / 0 0 100% 100%; padding-right: 10px; } .journal h3.today { --u: #e0524d; }
.journal ul { list-style: none; margin: 0; padding: 0; font-size: 20px; line-height: 25px; } .journal li { padding: 0 0 0 24px; position: relative; min-height: 18px; margin-bottom: 0; } .journal li::before { position: absolute; left: 2px; content: attr(data-b); font-weight: 700; color: var(--c, #26313f); }
.journal li.done { color: #55606e; text-decoration: line-through; } .journal li.done small { opacity: 1; } .journal li small { opacity: .85; font-size: 16px; } .journal .key { margin-top: 16px; font-size: 13px; opacity: .8; } .journal .box { border: 2px solid #26313f; border-radius: 3px 8px 4px 9px; padding: 8px 12px; margin-top: 14px; transform: rotate(.4deg); }

/* 7. NEWSPAPER: the nearest deadline is the headline */
.press { min-height: 100%; background: #f4f1e8; color: #151515; font-family: Newsreader, Georgia, "Times New Roman", serif; padding: 18px 26px 30px; }
.press .mast { text-align: center; border-bottom: 4px double #151515; padding-bottom: 6px; } .press .mast h1 { font: 400 56px/1 "Abril Fatface", Georgia, serif; margin: 0; letter-spacing: .01em; } .press .dateline { display: flex; justify-content: space-between; font: 11px/1.6 Georgia, serif; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid #151515; padding: 3px 0; margin-bottom: 12px; }
.press .lead { border-bottom: 1px solid #151515; padding-bottom: 10px; margin-bottom: 12px; } .press .lead h2 { font: 800 42px/1.02 Newsreader, Georgia, serif; margin: 0 0 6px; text-transform: uppercase; letter-spacing: -.01em; } .press .lead h2 span { color: #b3121d; } .press .lead p { font-size: 15px; margin: 0; columns: 2; column-gap: 22px; text-align: justify; }
.press .cols { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 22px; } .press .cols > div + div { border-left: 1px solid #151515; padding-left: 22px; } .press h3 { font: 700 13px/1 Georgia, serif; text-transform: uppercase; letter-spacing: .1em; border-top: 2px solid #151515; border-bottom: 1px solid #151515; padding: 5px 0; margin: 0 0 8px; }
.press table { width: 100%; border-collapse: collapse; font-size: 12.5px; } .press td, .press th { border-bottom: 1px dotted #777; padding: 3px 4px; text-align: left; vertical-align: top; } .press th { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; } .press td.t { font-weight: 700; white-space: nowrap; width: 46px; } .press tr.now td { background: #151515; color: #f4f1e8; }
.press .item { margin-bottom: 10px; font-size: 13px; } .press .item b { display: block; font-size: 15px; line-height: 1.15; } .press .item i { color: #b3121d; font-style: normal; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.press .fc { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 11px; } .press .fc div { border: 1px solid #151515; padding: 4px 0; } .press .fc b { display: block; font-size: 17px; } .press .fc .today { background: #151515; color: #f4f1e8; }

/* 8. DAY DIAL: the day as a clock face */
.dial { min-height: 100%; background: #0a0d1a radial-gradient(circle at 50% 30%, #1d2440, #0a0d1a 70%); color: #e8ecff; font-family: Outfit, "Work Sans", system-ui, sans-serif; padding: 16px 20px 26px; display: grid; grid-template-columns: minmax(360px, 1.2fr) 1fr; gap: 26px; align-items: center; }
.dial svg { width: 100%; height: auto; max-height: 560px; display: block; } .dial .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; } .dial .mini figure { margin: 0; text-align: center; font-size: 12px; color: #9aa6d6; } .dial .mini figure.today { color: #fff; font-weight: 700; }
.dial h2 { margin: 0 0 4px; font-size: 26px; } .dial p { color: #9aa6d6; margin: 0 0 16px; } .dial .legend span { display: inline-block; margin: 0 10px 6px 0; font-size: 12px; } .dial .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 5px; }

/* 9. BRUTALIST POSTER: giant numerals, slabs */
.slab { min-height: 100%; background: #FFEB3B; color: #000; font-family: Anton, Impact, "Arial Black", sans-serif; font-weight: 400; padding: 14px; }
.slab header { display: flex; align-items: flex-end; gap: 16px; border-bottom: 8px solid #000; padding-bottom: 6px; margin-bottom: 12px; } .slab header h1 { font-size: 92px; line-height: .8; margin: 0; letter-spacing: -.06em; } .slab header p { margin: 0; font: 700 14px/1.2 Epilogue, Arial, sans-serif; text-transform: uppercase; max-width: 300px; } .slab header .go { margin-left: auto; background: #000; color: #FFEB3B; border: 0; padding: 12px 20px; font-family: inherit; font-weight: 400; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; box-shadow: 6px 6px 0 #FF5252; }
.slab .cols { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; } .slab .d { border: 5px solid #000; background: #fff; min-height: 430px; padding: 6px; position: relative; } .slab .d.today { background: #000; color: #fff; box-shadow: 8px 8px 0 #FF5252; }
.slab .d > b { font-size: 58px; line-height: .85; letter-spacing: -.06em; display: block; } .slab .d > span { font: 700 11px Epilogue, Arial, sans-serif; text-transform: uppercase; letter-spacing: .1em; } .slab .s { margin-top: 6px; padding: 5px 6px; border: 3px solid #000; background: var(--c); color: #000; font-size: 12px; line-height: 1.05; text-transform: uppercase; }
.slab .d.today .s { border-color: #fff; } .slab .s small { display: block; font: 700 10px Epilogue, Arial, sans-serif; margin-top: 2px; } .slab .s.work { box-shadow: 4px 4px 0 #000; } .slab .d.today .s.work { box-shadow: 4px 4px 0 #FF5252; }

/* Accessibility, from the design skill's checklist: a visible focus ring, hover feedback that does not
   shift layout, no motion for people who asked for none, and larger targets on the switcher. */
:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }
[data-id]:hover { outline: 2px solid currentColor; outline-offset: 1px; }
#switcher button { min-height: 36px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.slab h1, .slab .d > b, .slab .s { font-weight: 400; } .slab .s { font-size: 15px; letter-spacing: .01em; }
.press .dateline, .press h3, .press th, .press .item i, .press .fc { font-family: Roboto, Arial, sans-serif; }
.dial p, .dial .legend, .dial figure { font-family: "Work Sans", system-ui, sans-serif; }

/* 10. BENTO: a dashboard of different-sized tiles (catalogue style 39) */
.bento { min-height: 100%; background: #EEF2FF; color: #1E1B4B; font-family: "DM Sans", system-ui, sans-serif; padding: 20px; }
.bento .tiles { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 148px; gap: 16px; }
.bento .t { background: #fff; border-radius: 24px; padding: 18px 20px; box-shadow: 0 4px 6px rgba(30,27,75,.06); overflow: hidden; transition: box-shadow .2s ease-out; }
.bento .t:hover { box-shadow: 0 10px 24px rgba(30,27,75,.14); } .bento small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #4F46E5; margin-bottom: 6px; }
.bento h2, .bento h3, .bento .big { font-family: "Space Grotesk", system-ui, sans-serif; margin: 0; } .bento .hero { grid-column: span 2; grid-row: span 2; background: #4F46E5; color: #fff; display: flex; flex-direction: column; justify-content: flex-end; }

<body>

    <label for="add-dur">How long will it take?</label><select id="add-dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1 h</option><option value="90">1 h 30 min</option><option value="120">2 h</option><option value="180">3 h</option></select>

  </form>
</dialog>
<script>
"use strict";
/* One shared week, fifteen ways of showing it. Every action changes the same state, so a task added
   in the terminal shows up on the corkboard. Nothing here talks to a server. */
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], FULL = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const DATES = [14, 15, 16, 17, 18, 19, 20], TODAY = 3, DAY_START = 360, DAY_LEN = 960, KEY = "flexweek-mockup-v2";
const CATS = {
  class: { label: "School", color: "#3b82f6", tui: "cy" }, assignments: { label: "Homework", color: "#ef4444", tui: "red" },
  study: { label: "Study", color: "#8b5cf6", tui: "vi" }, exercise: { label: "Sports", color: "#10b981", tui: "" },
  meals: { label: "Meals", color: "#f97316", tui: "or" }, extra: { label: "Activity", color: "#ec4899", tui: "pk" },
};
const seed = () => ({
  now: 820, viewDay: TODAY, seq: 1, clay: TODAY, oneSkip: 0, startOpen: false, focus: null,
  wins: { week: { x: 112, y: 22, open: true }, notes: { x: 560, y: 330, open: true }, next: { x: 150, y: 350, open: true } },
  tuiOut: ["type help for commands"],
  log: ["12:58 OK week saved, revision 14", "13:31 OK Math worksheet marked done", "13:40 OK plan accepted, 4 sessions placed", "13:40 WARN Science fair poster is not planned yet"],
  blocks: [
    { id: "school", title: "School", cat: "class", kind: "fixed", days: [0, 1, 2, 3, 4], start: 480, dur: 390 },
    { id: "band", title: "Band", cat: "extra", kind: "fixed", days: [2], start: 900, dur: 60 },
    { id: "soccer", title: "Soccer practice", cat: "exercise", kind: "fixed", days: [1, 3], start: 930, dur: 90 },
    { id: "dinner", title: "Dinner", cat: "meals", kind: "fixed", days: [0, 1, 2, 3, 4, 5, 6], start: 1080, dur: 30 },
    { id: "math", title: "Math worksheet", cat: "assignments", kind: "work", days: [0], start: 945, dur: 45, due: { day: 1, min: 480 }, done: true },
    { id: "chem", title: "Chem lab report", cat: "assignments", kind: "work", days: [3], start: 1200, dur: 90, due: { day: 3, min: 1439 } },
    { id: "essay", title: "History essay outline", cat: "assignments", kind: "work", days: [3], start: 1125, dur: 60, due: { day: 4, min: 1260 } },
    { id: "vocab", title: "Spanish vocab", cat: "study", kind: "work", days: [4], start: 930, dur: 30, due: { day: 7, min: 480 } },
    { id: "bio", title: "Bio reading ch. 4", cat: "study", kind: "work", days: [5], start: 600, dur: 60, due: { day: 7, min: 480 } },
    { id: "poster", title: "Science fair poster", cat: "assignments", kind: "work", days: [], start: null, dur: 120, due: { day: 6, min: 1200 } },
  ],
});
let state;
try { state = JSON.parse(localStorage.getItem(KEY)) || seed(); } catch { state = seed(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* private window: the demo still works */ } };

const hm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const dur = m => (m >= 60 ? Math.floor(m / 60) + " h" + (m % 60 ? " " + (m % 60) + " min" : "") : m + " min");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const col = o => CATS[o.cat].color, dueText = o => (o.due ? DAYS[o.due.day % 7] + " " + hm(o.due.min) : "");
let OCC = [], WORK = [], UNPLACED = [];
function riskOf(o) {
  if (o.kind !== "work" || o.done || !o.due) return 0;
  const slack = o.due.day * 1440 + o.due.min - (o.day * 1440 + o.start + o.dur);
  return slack < 0 ? 1 : slack < 720 ? 0.9 : slack < 2160 ? 0.55 : 0.2;
}
const slackOf = o => o.due.day * 1440 + o.due.min - (o.day * 1440 + o.start + o.dur);
const riskWord = o => (o.risk >= 1 ? "Misses it" : o.risk > .8 ? "At risk" : o.risk > .5 ? "Tight" : "Comfortable");
function derive() {
  OCC = state.blocks.flatMap(b => b.days.map(day => ({ ...b, day }))).sort((a, b) => a.day - b.day || a.start - b.start);
  OCC.forEach(o => { o.risk = riskOf(o); });
  WORK = OCC.filter(o => o.kind === "work");
  UNPLACED = state.blocks.filter(b => b.kind === "work" && !b.days.length);
}
const onDay = d => OCC.filter(o => o.day === d), loadMin = d => onDay(d).filter(o => o.kind === "work").reduce((t, o) => t + o.dur, 0);
const openWork = () => WORK.filter(o => !o.done).sort((a, b) => b.risk - a.risk || a.day - b.day);
const after = d => onDay(d).filter(o => !(o.kind === "work" && o.done) && (d !== TODAY || o.start > state.now));
const why = b => (b.tried ? `No free stretch of ${dur(b.dur)} before ${dueText(b)}.` : "Not planned yet. Press Plan my homework.");
function say(text) { document.getElementById("t-msg").textContent = text; state.log.push(hm(state.now) + " " + text); state.log = state.log.slice(-8); }

/* ---- actions: the only code that changes the week ---- */
function findSlot(day, length, from, skipId) {
  const open = day > 4 ? 540 : 900, close = 1290, busy = onDay(day).filter(o => o.id !== skipId);
  for (let t = Math.max(open, Math.ceil(from / 15) * 15); t + length <= close; t += 15) {
    if (!busy.some(o => t < o.start + o.dur && o.start < t + length)) return t;
  }
  return null;
}
function plan() {
  derive();
  let placed = 0; const waiting = UNPLACED.slice().sort((a, b) => a.due.day * 1440 + a.due.min - (b.due.day * 1440 + b.due.min));
  for (const item of waiting) {
    item.tried = true;
    for (let d = TODAY; d <= Math.min(item.due.day, 6); d++) {
      const slot = findSlot(d, item.dur, d === TODAY ? state.now : 0, item.id);
      if (slot !== null && d * 1440 + slot + item.dur <= item.due.day * 1440 + item.due.min) { item.days = [d]; item.start = slot; placed++; derive(); break; }
    }
  }
  say(waiting.length ? `Plan: placed ${placed} of ${waiting.length}.` + (placed < waiting.length ? " The rest has no room before its deadline." : "") : "Plan: everything already has a time.");
  commit();
}
function addHomework(title, minutes, dueDay, cat) {
  const id = "hw" + state.seq++;
  state.blocks.push({ id, title: title.trim() || "Untitled", cat: cat || "assignments", kind: "work", days: [], start: null, dur: minutes, due: { day: dueDay, min: dueDay > 6 ? 480 : 1260 } });
  say(`Added "${title.trim()}". Press Plan my homework to give it a time.`); commit(); return id;
}
const find = id => state.blocks.find(b => b.id === id);
function toggleDone(id) { const b = find(id); if (!b || b.kind !== "work") return; b.done = !b.done; say(`${b.title} ${b.done ? "marked done" : "reopened"}.`); commit(); }
function removeBlock(id) { const b = find(id); if (!b) return; state.blocks = state.blocks.filter(x => x !== b); if (state.focus && state.focus.id === id) state.focus = null; say(`${b.title} deleted.`); commit(); }
function moveTo(id, day) {
  const b = find(id); if (!b || b.kind !== "work") return;
  derive(); const slot = findSlot(day, b.dur, day === TODAY ? state.now : 0, id);
  if (slot === null) { say(`${DAYS[day]} has no free ${dur(b.dur)} for ${b.title}.`); commit(); return; }
  b.days = [day]; b.start = slot;
  const late = b.due && day * 1440 + slot + b.dur > b.due.day * 1440 + b.due.min;
  say(`${b.title} moved to ${DAYS[day]} ${hm(slot)}.` + (late ? ` That is after it is due (${dueText(b)}).` : "")); commit();
}
function startFocus(id) { const b = find(id); if (!b) return; state.focus = { id, title: b.title, endsAt: Date.now() + 25 * 60000 }; say(`Focus started on ${b.title}.`); commit(); }
function stopFocus() { state.focus = null; say("Focus stopped."); commit(); }
function setNow(min) { state.now = Math.max(DAY_START, Math.min(1320, min)); state.oneSkip = 0; commit(true); }
function commit(quiet) { save(); render(); if (!quiet) syncTools(); }

/* ---- the terminal's command line ---- */
function runCommand(line) {
  const out = text => state.tuiOut.push(text), words = line.trim().split(/\s+/), verb = (words[0] || "").toLowerCase(), rest = line.trim().slice(verb.length).trim();
  const match = text => state.blocks.find(b => b.kind === "work" && b.title.toLowerCase().includes(text.toLowerCase()));
  state.tuiOut.push("> " + line);
  if (verb === "help") out('add "title" <minutes> <day> | done <text> | undo <text> | rm <text> | move <text> <day> | plan | next | now <hh:mm> | view <n> | reset');
  else if (verb === "add") {
    const m = /^(?:"([^"]+)"|(\S+))\s*(\d+)?\s*(mon|tue|wed|thu|fri|sat|sun)?$/i.exec(rest);
    if (!m) out('usage: add "Science fair poster" 120 sun');
    else { addHomework(m[1] || m[2], Math.max(15, Math.round(Number(m[3] || 60) / 15) * 15), m[4] ? DAYS.findIndex(d => d.toLowerCase() === m[4].toLowerCase()) : 6); out("added. type plan to place it."); }
  } else if (verb === "done" || verb === "undo") { const b = rest && match(rest); if (!b) out("no homework matches " + rest); else { if (b.done !== (verb === "done")) toggleDone(b.id); out(b.title + (verb === "done" ? " done." : " reopened.")); } }
  else if (verb === "rm") { const b = rest && match(rest); if (!b) out("no homework matches " + rest); else { removeBlock(b.id); out("deleted."); } }
  else if (verb === "move") { const day = DAYS.findIndex(d => d.toLowerCase() === (words[words.length - 1] || "").toLowerCase()), b = match(words.slice(1, -1).join(" ")); if (day < 0 || !b) out("usage: move essay fri"); else { moveTo(b.id, day); out(document.getElementById("t-msg").textContent); } }
  else if (verb === "plan") { plan(); out(document.getElementById("t-msg").textContent); }
  else if (verb === "next") { const n = after(TODAY)[0]; out(n ? `${hm(n.start)} ${n.title}, in ${dur(n.start - state.now)}` : "nothing else today."); }
  else if (verb === "now") { const m = /^(\d{1,2}):(\d{2})$/.exec(rest); if (!m) out("usage: now 16:30"); else { setNow(Number(m[1]) * 60 + Number(m[2])); syncTools(); out("clock set to " + hm(state.now)); } }
  else if (verb === "view") { const n = Number(rest); if (n >= 1 && n <= CONCEPTS.length) { show(n - 1); return; } out("usage: view 1.." + CONCEPTS.length); }
  else if (verb === "reset") { resetDemo(); return; }
  else if (verb) out("unknown command. type help.");
  state.tuiOut = state.tuiOut.slice(-7); commit();
}
function resetDemo() { state = seed(); say("Demo reset."); commit(); }

function tui() {
  const W = 11, pad = (s, n = W) => (s.length > n ? s.slice(0, n - 1) + "~" : s.padEnd(n));
  let out = `<span class="dim">       ┌${Array(7).fill("─".repeat(W)).join("┬")}┐</span>\n       <span class="dim">│</span>${DAYS.map((n, d) => `<span class="${d === TODAY ? "amb" : ""}">${pad(` ${n} ${DATES[d]}${d === TODAY ? " <" : ""}`)}</span>`).join('<span class="dim">│</span>')}<span class="dim">│</span>\n<span class="dim">       ├${Array(7).fill("─".repeat(W)).join("┼")}┤</span>\n`;
  for (let h = 6; h < 22; h++) {
    const cells = DAYS.map((_, d) => {
      const o = onDay(d).filter(x => x.start < (h + 1) * 60 && x.start + x.dur > h * 60).sort((a, b) => (b.kind === "work") - (a.kind === "work"))[0];
      if (!o) return " ".repeat(W);
      return `<span class="${o.done ? "dim" : CATS[o.cat].tui}" data-id="${o.id}">${o.start >= h * 60 ? pad((o.kind === "work" ? ">" : "#") + esc(o.title)) : pad(" " + (o.kind === "work" ? "▒" : "░").repeat(W - 2))}</span>`;
    });
    out += `${Math.floor(state.now / 60) === h ? '<span class="red">&gt;</span>' : " "}<span class="dim">${hm(h * 60)} │</span>${cells.join('<span class="dim">│</span>')}<span class="dim">│</span>\n`;
  }
  out += `<span class="dim">       └${Array(7).fill("─".repeat(W)).join("┴")}┘</span>`;
  const queue = openWork().map(o => `<span class="${o.risk > .8 ? "red" : o.risk > .5 ? "amb" : ""}" data-id="${o.id}">${o.risk > .8 ? "!!" : o.risk > .5 ? " !" : "  "} ${pad(o.title, 24)} ${pad(dur(o.dur), 10)} due ${dueText(o)}</span>`).join("\n");
  const waiting = UNPLACED.map(b => `<span class="red" data-id="${b.id}">?? ${pad(b.title, 24)} ${pad(dur(b.dur), 10)} due ${dueText(b)}</span>\n   <span class="dim">└ ${esc(why(b))}</span>`).join("\n");
  const next = after(TODAY).slice(0, 2).map(o => `${hm(o.start)}  ${pad(o.title, 24)} in ${dur(o.start - state.now)}`).join("\n") || "nothing else today.";

  <h5 style="margin-top:12px">LEGEND</h5><pre><span class="cy">#</span> fixed   <span class="red">&gt;</span> homework the plan placed   <span class="dim">dim</span> done</pre>
  <h5 style="margin-top:12px">COMMANDS</h5><pre><span class="amb">add</span> "title" 60 sun   <span class="amb">done</span> chem   <span class="amb">move</span> essay fri\n<span class="amb">plan</span>   <span class="amb">next</span>   <span class="amb">now</span> 16:30   <span class="amb">view</span> 5   <span class="amb">help</span></pre>
  <h5 style="margin-top:12px">NEXT</h5><pre>${esc(next)}</pre></div>
  <div class="cmd"><pre><span class="dim">${state.tuiOut.map(esc).join("\n")}</span></pre><form data-form="tui"><span class="amb">›</span><input id="tui-in" aria-label="Command" autocomplete="off" spellcheck="false" placeholder='try: add "Poster" 60 sun'></form></div></div>`;
}

function river() {
  const d = state.viewDay, list = onDay(d), next = after(d)[0], max = Math.max(...DAYS.map((_, i) => loadMin(i)), 1), nowPill = `<div class="now"><span>NOW ${hm(state.now)}</span></div>`;

function dialSvg(d, size, big) {
  const c = size / 2, r = size * 0.38, w = size * (big ? 0.11 : 0.13), ang = m => (-150 + (m - DAY_START) / DAY_LEN * 300) * Math.PI / 180;
  const pt = (a, rad) => [c + rad * Math.sin(a), c - rad * Math.cos(a)];
  const arc = (m1, m2, rad) => { const [x1, y1] = pt(ang(m1), rad), [x2, y2] = pt(ang(m2), rad); return `M${x1.toFixed(1)} ${y1.toFixed(1)}A${rad} ${rad} 0 ${ang(m2) - ang(m1) > Math.PI ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
  let s = `<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="${FULL[d]} shown as a clock face from 06:00 to 22:00"><path d="${arc(DAY_START, DAY_START + DAY_LEN, r)}" fill="none" stroke="#232b4d" stroke-width="${w}" stroke-linecap="round"/>`;
  onDay(d).forEach(o => { s += `<path ${big ? `data-id="${o.id}"` : ""} d="${arc(o.start, o.start + o.dur, o.kind === "work" ? r + w * 0.75 : r)}" fill="none" stroke="${col(o)}" stroke-width="${o.kind === "work" ? w * 0.5 : w}" opacity="${o.done ? .35 : 1}"/>`; });
  if (big) {
    for (let h = 6; h <= 22; h += 2) { const [x, y] = pt(ang(h * 60), r - w * 1.15); s += `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" fill="#7f8cc0" font-size="12" text-anchor="middle">${h}</text>`; }
    const next = after(d)[0];
    if (d === TODAY) { const [hx, hy] = pt(ang(state.now), r + w); s += `<line x1="${c}" y1="${c}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="#ff4d6d" stroke-width="3" stroke-linecap="round"/><circle cx="${c}" cy="${c}" r="6" fill="#ff4d6d"/>`; }
    s += next ? `<text x="${c}" y="${c + 46}" fill="#9aa6d6" font-size="13" text-anchor="middle">next · ${hm(next.start)}</text><text x="${c}" y="${c + 72}" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">${esc(next.title)}</text>${d === TODAY ? `<text x="${c}" y="${c + 94}" fill="#9aa6d6" font-size="13" text-anchor="middle">in ${dur(next.start - state.now)}</text>` : ""}`
      : `<text x="${c}" y="${c + 66}" fill="#fff" font-size="19" font-weight="700" text-anchor="middle">Nothing else</text>`;
  }
  return s + "</svg>";
}
function dial() {
  const d = state.viewDay;
  return `<div class="dial"><div>${dialSvg(d, 520, true)}</div><div><h2>${FULL[d]}, September ${DATES[d]}</h2><p>06:00 at the lower left, 22:00 at the lower right. Thick arcs are fixed; the thin outer arcs are homework the plan placed. Click a small dial to open that day.</p>
  <div class="legend">${Object.values(CATS).map(c => `<span style="--c:${c.color}"><i></i>${c.label}</span>`).join("")}</div><div class="mini">${DAYS.map((n, i) => `<figure class="${i === d ? "today" : ""}" data-act="day" data-arg="${i}" aria-label="Show ${FULL[i]}">${dialSvg(i, 150, false)}${n} ${DATES[i]}</figure>`).join("")}${UNPLACED.slice(0, 1).map(b => `<figure data-id="${b.id}" style="align-self:center;border:1px dashed #56629a;border-radius:12px;padding:10px;color:#ffb3c0">${esc(b.title)}<br>not placed yet${UNPLACED.length > 1 ? ` (+${UNPLACED.length - 1})` : ""}</figure>`).join("")}</div></div></div>`;
}

function slab() {
  const open = openWork().length, worst = openWork()[0];
  return `<div class="slab"><header><h1>WK38</h1><p>${open} open. ${UNPLACED.length ? UNPLACED.length + " with no time yet." : "Everything has a time."} ${worst && worst.risk > .5 ? esc(worst.title) + " is the tight one." : ""}</p><button class="go" data-act="plan">Plan it</button></header><div class="cols">${DAYS.map((n, d) => `<div class="d ${d === TODAY ? "today" : ""}"><b>${DATES[d]}</b><span>${FULL[d]}</span>${onDay(d).map(o => `<div class="s ${o.kind}" data-id="${o.id}" style="--c:${o.kind === "work" ? col(o) : "#fff"};${o.done ? "background:#d4d4d4;text-decoration:line-through" : ""}">${esc(o.title)}<small>${hm(o.start)} · ${dur(o.dur)}${o.due ? " · DUE " + dueText(o) : ""}</small></div>`).join("")}</div>`).join("")}</div></div>`;
}

function bento() {
  const today = onDay(TODAY), next = after(TODAY)[0], tonight = today.find(o => o.kind === "work" && !o.done && o.start + o.dur > state.now), max = Math.max(...DAYS.map((_, d) => loadMin(d)), 1);
  return `<div class="bento"><div class="tiles">
  ${next ? `<section class="t hero" data-id="${next.id}"><small>Up next · in ${dur(next.start - state.now)}</small><h2>${esc(next.title)}</h2><p>${hm(next.start)}–${hm(next.start + next.dur)} · ${CATS[next.cat].label}</p></section>` : `<section class="t hero"><small>Up next</small><h2>Nothing else today</h2><p>The rest of the day is yours.</p></section>`}
  <section class="t tall"><small>Deadlines</small>${openWork().slice(0, 5).map(o => `<div class="dl" data-id="${o.id}"><span><b>${esc(o.title)}</b><br>${dueText(o)}</span><span class="tag ${o.risk > .8 ? "risk" : o.risk > .5 ? "tight" : ""}">${riskWord(o)}</span></div>`).join("") || "<p>None open.</p>"}</section>
  ${tonight ? `<section class="t"><small>Tonight</small><h3 data-id="${tonight.id}">${esc(tonight.title)}</h3><p style="margin:4px 0 0">${hm(tonight.start)} · ${dur(tonight.dur)}</p><button data-act="focus" data-arg="${tonight.id}">Start focus</button></section>` : `<section class="t"><small>Tonight</small><h3>No homework tonight</h3></section>`}
  <section class="t"><small>Homework this week</small><div class="big">${dur(DAYS.reduce((t, _, d) => t + loadMin(d), 0))}</div><p style="margin:2px 0 0">${WORK.length} sessions, ${WORK.filter(o => o.done).length} done</p></section>
  ${UNPLACED.length ? `<section class="t" data-id="${UNPLACED[0].id}"><small>Not placed yet${UNPLACED.length > 1 ? " (" + UNPLACED.length + ")" : ""}</small><h3>${esc(UNPLACED[0].title)}</h3><p style="margin:4px 0 0;font-size:13px">${dur(UNPLACED[0].dur)} · due ${dueText(UNPLACED[0])}</p></section>` : `<section class="t"><small>Not placed yet</small><h3>Nothing waiting</h3></section>`}
  <section class="t wide"><small>Load by day, in minutes</small><div class="bars">${DAYS.map((n, d) => `<div class="${d === TODAY ? "today" : ""}" style="height:${Math.max(loadMin(d) / max * 100, 6)}%"><span>${n} ${loadMin(d) || "0"}</span></div>`).join("")}</div></section>
  <section class="t full"><small>Today, ${FULL[TODAY]}</small><div class="strip">${today.map(o => `<div data-id="${o.id}" class="${o.start + o.dur <= state.now || o.done ? "past" : ""}" style="--c:${col(o)}"><b>${hm(o.start)}</b><br>${esc(o.title)}</div>`).join("")}</div></section>
  </div></div>`;
}

function y2k() {
  const w = state.wins, pos = n => `left:${w[n].x}px;top:${w[n].y}px`;
  const cells = DAYS.map((_, d) => `<td>${onDay(d).map(o => `<div data-id="${o.id}" style="--c:${col(o)};${o.done ? "text-decoration:line-through" : ""}">${hm(o.start)} ${esc(o.title)}</div>`).join("")}</td>`).join("");
  const lines = openWork().map(o => `${o.risk > .8 ? "!!" : o.risk > .5 ? " !" : "  "} ${o.title.padEnd(24)} ${dueText(o)}`).concat(UNPLACED.map(b => `?? ${b.title.padEnd(24)} ${dueText(b)}`)).join("\n") || "nothing open.";
  const next = after(TODAY)[0];
  return `<div class="y2k"><div class="icons"><div><b></b>My Week</div><div><b></b>Homework</div><div><b></b>Focus Timer</div><div><b></b>Recycle Bin</div></div>
  ${w.week.open ? `<div class="win" data-win="week" style="${pos("week")};width:820px"><div class="bar"><span>Week.exe — September 14 to 20</span><span><i data-act="win" data-arg="week" role="button" aria-label="Close Week"></i></span></div><div class="body"><div style="margin-bottom:6px">File &nbsp; Edit &nbsp; View &nbsp; Plan &nbsp; Help</div><div class="sunken"><table><tr>${DAYS.map((n, d) => `<th class="${d === TODAY ? "today" : ""}">${n} ${DATES[d]}${d === TODAY ? " (today)" : ""}</th>`).join("")}</tr><tr>${cells}</tr></table></div></div></div>` : ""}
  ${w.notes.open ? `<div class="win" data-win="notes" style="${pos("notes")};width:500px"><div class="bar"><span>deadlines.txt — Notepad</span><span><i data-act="win" data-arg="notes" role="button" aria-label="Close Notepad"></i></span></div><div class="body"><div class="sunken vt"><pre style="margin:0;font:inherit">${esc(lines)}</pre></div></div></div>` : ""}
  ${w.next.open ? `<div class="win" data-win="next" style="${pos("next")};width:350px"><div class="bar"><span>Up next</span><span><i data-act="win" data-arg="next" role="button" aria-label="Close Up next"></i></span></div><div class="body"><p style="margin:2px 0 8px">${next ? `<b>${esc(next.title)}</b> starts at ${hm(next.start)}, in ${dur(next.start - state.now)}.` : "Nothing else today."}</p><button class="btn" data-act="win" data-arg="next">OK</button> <button class="btn" data-act="plan">Plan my homework</button> <button class="btn" data-act="add">Add…</button></div></div>` : ""}
  ${state.startOpen ? `<div class="menu">${CONCEPTS.map((c, i) => `<button data-act="view" data-arg="${i}">${esc(c.name)}</button>`).join("")}</div>` : ""}
  <div class="task"><button class="btn" style="font-weight:700" data-act="start">Start</button>${[["week", "Week.exe"], ["notes", "deadlines.txt"], ["next", "Up next"]].map(([n, label]) => `<button class="btn ${w[n].open ? "on" : ""}" data-act="win" data-arg="${n}">${label}</button>`).join("")}<span class="clock">${hm(state.now)}</span></div></div>`;
}

function one() {
  const list = after(TODAY), at = Math.min(state.oneSkip, Math.max(list.length - 1, 0)), next = list[at], pct = m => (m - DAY_START) / DAY_LEN * 100, now = onDay(TODAY).find(o => o.start <= state.now && o.start + o.dur > state.now);
  return `<div class="one"><div class="top"><span>${FULL[TODAY]} ${DATES[TODAY]} · ${hm(state.now)}</span><span>${now ? esc(now.title) + " until " + hm(now.start + now.dur) : "Free right now"}</span></div>
  <div class="mid" ${next ? `data-id="${next.id}"` : ""}><h1>${next ? esc(next.title) : "Nothing else today"}</h1><h2>${next ? hm(next.start) + " · in " + dur(next.start - state.now) : "See you tomorrow"}</h2></div>
  <div><div class="day" aria-hidden="true">${onDay(TODAY).map(o => `<i class="${o === next ? "next" : ""}" style="left:${pct(o.start)}%;width:${o.dur / DAY_LEN * 100}%"></i>`).join("")}<u style="left:${pct(state.now)}%"></u></div>
  <div class="foot"><span>${list.slice(at + 1, at + 3).length ? "Then: " + list.slice(at + 1, at + 3).map(o => esc(o.title) + " " + hm(o.start)).join(", ") : "Then: nothing"}</span><span>Space: what is after that · W: the week</span></div></div></div>`;
}

function heat() {
  const WEEKS = 16, level = m => (m === 0 ? 0 : m <= 30 ? 1 : m <= 60 ? 2 : m <= 120 ? 3 : 4), first = new Date(Date.UTC(2026, 8, 14));
  const loadAt = (w, d) => { if (w === 0) return loadMin(d); const h = (w * 7 + d) * 2654435761 % 97, base = [0, 0, 30, 45, 60, 90, 120, 150][h % 8]; return w === 13 ? Math.min(base + 90, 210) : d > 4 ? Math.round(base / 2 / 15) * 15 : base; };
  const dueAt = (w, d) => (w === 0 ? WORK.some(o => !o.done && o.due.day === d) : (w * 5 + d * 3) % 11 === 0);
  let rows = `<div></div>${DAYS.map(n => `<div class="h">${n}</div>`).join("")}<div class="h">Week</div>`, thisWeek = 0;
  for (let w = 0; w < WEEKS; w++) {
    const label = new Date(first.getTime() + w * 7 * 864e5).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
    let total = 0; const cells = DAYS.map((n, d) => { const m = loadAt(w, d); total += m; const due = dueAt(w, d);
      return `<div class="cell l${level(m)} ${due ? "due" : ""} ${w === 0 && d === TODAY ? "now" : ""} ${w === 0 ? "open" : ""}" ${w === 0 ? `data-act="openday" data-arg="${d}"` : ""} title="${n} of the week of ${label}: ${m} min planned${due ? ", a deadline" : ""}">${m || ""}</div>`; }).join("");
    if (w === 0) thisWeek = total;
    rows += `<div class="wk ${w === 0 ? "cur" : ""}">${label}</div>${cells}<div class="tot">${(total / 60).toFixed(1)} h</div>`;
    if (w === 13) rows += `<div class="exam">Finals week: the heaviest of the term. Starting two sessions a week earlier would flatten it.</div>`;
  }
  return `<div class="heat"><h1>Fall semester, week by week</h1><div class="sub">Each cell is a day. The number is minutes of homework planned; a darker cell is a heavier day; a diamond marks a deadline. Click a day in this week to open it.</div><div class="wrap"><div><div class="legend">Lighter ${["0", "≤30", "≤60", "≤120", "120+"].map((t, i) => `<span class="cell l${i}">${t}</span>`).join("")} heavier, in minutes</div><div class="grid">${rows}</div></div>
  <div><div class="card"><b>This week</b>${dur(thisWeek)} planned over ${WORK.length} sessions, ${WORK.filter(o => o.done).length} done.</div><div class="card"><b>Heaviest week ahead</b>The week of December 14, finals. About 14 hours.</div>${UNPLACED.map(b => `<div class="card" data-id="${b.id}"><b>Not placed yet</b>${esc(b.title)}, ${dur(b.dur)}, due ${dueText(b)}.</div>`).join("")}<div class="card"><b>Why this view</b>Week and Month answer "what now". This answers "when does it get bad", early enough to do something about it. Weeks after this one are sample data.</div></div></div></div>`;
}

function pixel() {
  const slot = Math.floor((state.now - DAY_START) / 60), worst = openWork()[0];
  return `<div class="pixel"><h1>FLEXWEEK  WEEK 38</h1><div class="sub">THURSDAY 17 SEPTEMBER · ${hm(state.now)} · HOUR ${slot + 1} OF 16</div>
  <div class="sun px" aria-hidden="true">${Array.from({ length: 16 }, (_, i) => `<i class="${i < slot ? "on" : i === slot ? "cur" : ""}"></i>`).join("")}</div>
  <div class="cols">${DAYS.map((n, d) => `<div class="d px ${d === TODAY ? "today" : ""}"><h3>${n.toUpperCase()} ${DATES[d]}</h3>${onDay(d).map(o => `<div class="r ${o.done ? "done" : ""}" ${o.kind === "work" ? `data-toggle="${o.id}"` : `data-id="${o.id}"`} style="--c:${col(o)}">${o.kind === "work" ? (o.done ? "[X] " : "[ ] ") : ""}${esc(o.title)}<small>${hm(o.start)} ${dur(o.dur)}${o.risk > .8 ? " !! DUE " + dueText(o).toUpperCase() : ""}</small></div>`).join("")}</div>`).join("")}</div>
  <div class="say px">${worst ? `<b>${esc(worst.title.toUpperCase())}</b> IS DUE ${dueText(worst).toUpperCase()}. ${riskWord(worst).toUpperCase()}.` : "EVERYTHING ON THE PLAN IS DONE."}${UNPLACED.length ? " " + UNPLACED.length + " NOT PLACED YET." : ""} CLICK A [ ] ROW TO TICK IT. <u>_</u></div></div>`;

function clay() {
  const bgs = ["#FDBCB4", "#ADD8E6", "#c9f7d0", "#E6E6FA", "#ffe2b8", "#ADD8E6", "#FDBCB4"], mid = state.clay, shown = [mid - 2, mid - 1, mid, mid + 1, mid + 2].filter(d => d >= 0 && d <= 6);
  const card = d => { const off = d - mid, s = off === 0 ? 1 : Math.abs(off) === 1 ? .86 : .72;
    return `<div class="c ${d === TODAY ? "today" : ""}" style="--bg:${bgs[d]};--s:${s};--r:${off * 3}deg;--z:${5 - Math.abs(off)}"><h2>${FULL[d]} ${DATES[d]}</h2>${onDay(d).map(o => `<div class="pill ${o.done ? "done" : ""}" data-id="${o.id}" style="--c:${col(o)}"><i></i><span>${esc(o.title)}<small>${hm(o.start)} · ${dur(o.dur)}</small></span>${o.kind === "work" && !o.done ? `<span class="chip">${o.risk > .8 ? "at risk" : "due " + DAYS[o.due.day % 7]}</span>` : ""}</div>`).join("") || "<p>A free day.</p>"}</div>`; };

}

  { id: "heat", name: "Semester heatmap", render: heat, tryit: "Click a day in the top row (this week) to open it in Timeline. Add homework and plan: the top row darkens.", what: "Zoomed right out: sixteen weeks of day cells, darker where the homework is heavier, with weekly totals and deadlines marked.", who: "Planners, and it fills the Year view the roadmap still lists as open.", qt: "A QTableView with a delegate, like Month. Needs a new read-only API over many weeks.", cat: "Style 29, Heat Map. Pairing 42 (Fira Sans, Fira Code). Palette 8. One hue, minutes written in and a diamond for deadlines, because the catalogue warns about colour blindness." },
  { id: "pixel", name: "Pixel", render: pixel, tryit: "Click a [ ] row to tick it. Drag Now and the day bar fills.", what: "An 8-bit look: chunky pixel borders, a sixteen-square day bar, checkbox rows and a dialogue box that says what matters.", who: "Students who like retro games and want the planner to feel like one without being one.", qt: "A stylesheet, a bundled bitmap font and hard-edged borders; the layout is the normal week.", cat: "Style 52, Pixel Art. Pairing 52 (Press Start 2P, VT323). Look only: no points, levels or streaks, which the roadmap rules out." },
  { id: "clay", name: "Clay deck", render: clay, tryit: "Press Earlier and Later to flip the deck. Click a pill.", what: "Puffy day cards in a deck with one day in the middle and its neighbours tucked behind. You flip through days rather than scan a grid.", who: "Younger students, and anyone on a touch screen.", qt: "QGraphicsView for the overlapping, rotated cards; double shadows need QGraphicsEffects.", cat: "Style 9, Claymorphism. Pairing 6 (Fredoka, Nunito). Dark text on the pastels, as the catalogue's 4.5 to 1 warning asks." },
];

/* ---- shell: switching, rendering, input ---- */
const stage = document.getElementById("stage"), nav = document.getElementById("switcher"), notes = document.getElementById("notes");
let current = 0;
function render() {
  derive();
  const c = CONCEPTS[current], hadCommand = document.activeElement && document.activeElement.id === "tui-in";
  stage.innerHTML = c.render();
  stage.querySelectorAll("[data-id], [data-toggle], [data-act]:not(button)").forEach(el => { el.setAttribute("tabindex", "0"); if (!el.hasAttribute("role")) el.setAttribute("role", "button"); });
  if (c.id === "tui" && hadCommand) document.getElementById("tui-in").focus();
}
function show(index) {
  current = (index + CONCEPTS.length) % CONCEPTS.length;
  const c = CONCEPTS[current];
  document.body.dataset.concept = c.id; closePop(); render(); stage.scrollTop = 0;
  nav.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === current)));
  notes.innerHTML = `<div><b>Try this</b>${esc(c.tryit)}</div><div><b>What changes</b>${c.what}</div><div><b>Who it is for</b>${c.who}</div><div><b>Building it natively (Qt)</b>${c.qt}</div><div><b>From the design catalogue</b>${c.cat}</div>`;
  history.replaceState(null, "", "#" + c.id);
  if (c.id === "tui") document.getElementById("tui-in").focus();
}
CONCEPTS.forEach((c, i) => { const b = document.createElement("button"); b.type = "button"; b.innerHTML = (i < 9 ? `<kbd>${i + 1}</kbd>` : "") + c.name; b.addEventListener("click", () => show(i)); nav.appendChild(b); });

function syncTools() {
  document.getElementById("t-now").value = state.now; document.getElementById("t-now-out").textContent = hm(state.now);
  const chip = document.getElementById("t-focus");
  if (!state.focus) { chip.hidden = true; return; }
  const left = Math.max(0, Math.round((state.focus.endsAt - Date.now()) / 1000));
  chip.hidden = false; chip.innerHTML = `Focus · ${esc(state.focus.title)} · ${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")} <button type="button" data-tool="stop">Stop</button>`;
  if (!left) { say(`Focus session on ${state.focus.title} finished.`); state.focus = null; save(); chip.hidden = true; }
}
setInterval(() => { if (state.focus) syncTools(); }, 1000);

function openAdd(cat) {
  const due = document.getElementById("add-due"); due.innerHTML = "";
  for (let d = TODAY; d <= 7; d++) due.add(new Option(d === TODAY ? "Tonight" : d === 7 ? "Next Monday morning" : FULL[d], d));
  due.value = "6"; document.getElementById("add-cat").value = cat && CATS[cat] ? cat : "assignments"; document.getElementById("add-name").value = "";
  document.getElementById("add-dialog").showModal();
}
/* Listen for submit, not the dialog's close: close never fired under QtWebEngine, and submit names the button that was pressed. */
document.getElementById("add-form").addEventListener("submit", event => {
  if (!event.submitter || event.submitter.value !== "ok") return;
  addHomework(document.getElementById("add-name").value, Number(document.getElementById("add-dur").value), Number(document.getElementById("add-due").value), document.getElementById("add-cat").value);
});
document.getElementById("t-add").addEventListener("click", () => openAdd());
document.getElementById("t-plan").addEventListener("click", plan);
document.getElementById("t-reset").addEventListener("click", resetDemo);
document.getElementById("t-now").addEventListener("input", event => { setNow(Number(event.target.value)); document.getElementById("t-now-out").textContent = hm(state.now); });
document.getElementById("t-focus").addEventListener("click", event => { if (event.target.dataset.tool === "stop") stopFocus(); });

function closePop() { const p = document.getElementById("pop"); if (p) p.remove(); }
function openPop(id, anchor) {
  const b = find(id); if (!b) return;
  const occ = OCC.find(o => o.id === id), pop = document.createElement("div"); pop.id = "pop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", b.title);
  const when = b.days.length ? (b.days.length > 1 ? b.days.map(d => DAYS[d]).join(", ") : DAYS[b.days[0]]) + " " + hm(b.start) + "–" + hm(b.start + b.dur) : "not placed yet";
  const days = Array.from({ length: 7 - TODAY }, (_, i) => TODAY + i).map(d => `<option value="${d}" ${b.days[0] === d ? "selected" : ""}>${FULL[d]}</option>`).join("");
  pop.innerHTML = `<h4>${esc(b.title)}</h4><p>${CATS[b.cat].label} · ${dur(b.dur)} · ${when}</p>${b.due ? `<p>Due ${dueText(b)}${occ && !b.done ? " · " + riskWord(occ) : ""}</p>` : ""}${!b.days.length ? `<p>${esc(why(b))}</p>` : ""}
  <div class="row">${b.kind === "work" ? `<button data-pop="done">${b.done ? "Reopen" : "Mark done"}</button><button data-pop="focus">Start focus</button><label>Move to <select data-pop="move"><option value="">…</option>${days}</select></label><button data-pop="delete">Delete</button>` : ""}<button data-pop="close">Close</button></div>`;
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect(); pop.style.left = Math.min(Math.max(8, r.left), innerWidth - 280) + "px"; pop.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 8)) + "px";
  pop.addEventListener("click", event => { const a = event.target.dataset.pop; if (!a || a === "move") return; closePop(); if (a === "done") toggleDone(id); else if (a === "focus") startFocus(id); else if (a === "delete") removeBlock(id); });
  pop.addEventListener("change", event => { if (event.target.dataset.pop === "move" && event.target.value !== "") { closePop(); moveTo(id, Number(event.target.value)); } });
  pop.querySelector("button").focus();
}
const ACTIONS = {
  plan, add: arg => openAdd(arg), focus: arg => startFocus(arg), view: arg => show(Number(arg)),
  day: arg => { state.viewDay = Number(arg); commit(true); }, openday: arg => { state.viewDay = Number(arg); save(); show(CONCEPTS.findIndex(c => c.id === "river")); },
  clay: arg => { state.clay = Number(arg) === 0 ? TODAY : Math.max(0, Math.min(6, state.clay + Number(arg))); commit(true); },
  win: arg => { state.wins[arg].open = !state.wins[arg].open; commit(true); }, start: () => { state.startOpen = !state.startOpen; commit(true); },
};
stage.addEventListener("click", event => {
  const act = event.target.closest("[data-act]"), toggle = event.target.closest("[data-toggle]"), block = event.target.closest("[data-id]");
  closePop();
  if (act) { if (act.dataset.act !== "start" && state.startOpen) state.startOpen = false; ACTIONS[act.dataset.act](act.dataset.arg); event.stopPropagation(); }
  else if (toggle) toggleDone(toggle.dataset.toggle);
  else if (block) { openPop(block.dataset.id, block); event.stopPropagation(); }
});
stage.addEventListener("submit", event => { if (event.target.dataset.form !== "tui") return; event.preventDefault(); const field = document.getElementById("tui-in"), line = field.value; field.value = ""; if (line.trim()) runCommand(line); });

/* corkboard: drag a sticky onto a day */
stage.addEventListener("dragstart", event => { const note = event.target.closest("[data-drag]"); if (note) { event.dataTransfer.setData("text/plain", note.dataset.drag); event.dataTransfer.effectAllowed = "move"; } });
stage.addEventListener("dragover", event => { const colEl = event.target.closest(".board .col"); if (colEl) { event.preventDefault(); colEl.classList.add("over"); } });
stage.addEventListener("dragleave", event => { const colEl = event.target.closest(".board .col"); if (colEl) colEl.classList.remove("over"); });
stage.addEventListener("drop", event => { const colEl = event.target.closest(".board .col"); if (!colEl) return; event.preventDefault(); const id = event.dataTransfer.getData("text/plain"); if (id) moveTo(id, Number(colEl.dataset.day)); });

/* retro desktop: drag a window by its title bar */
let dragWin = null;
stage.addEventListener("pointerdown", event => { const bar = event.target.closest(".y2k .bar"); if (!bar || event.target.closest("[data-act]")) return; const win = bar.parentElement, name = win.dataset.win; dragWin = { win, name, dx: event.clientX - state.wins[name].x, dy: event.clientY - state.wins[name].y }; try { bar.setPointerCapture(event.pointerId); } catch { /* dragging still works without capture */ } });
stage.addEventListener("pointermove", event => { if (!dragWin) return; const p = state.wins[dragWin.name]; p.x = Math.max(0, event.clientX - dragWin.dx); p.y = Math.max(0, event.clientY - dragWin.dy); dragWin.win.style.left = p.x + "px"; dragWin.win.style.top = p.y + "px"; });
stage.addEventListener("pointerup", () => { if (dragWin) { dragWin = null; save(); } });

/* Shortcuts never fire while someone is typing: the same bug class the native review found. */
document.addEventListener("keydown", event => {
  if (event.target.closest("input, textarea, select, dialog")) { if (event.key === "Escape") closePop(); return; }
  const focused = document.activeElement, id = CONCEPTS[current].id;
  if (event.key === " " && id === "one") { event.preventDefault(); closePop(); state.oneSkip = state.oneSkip + 1 >= after(TODAY).length ? 0 : state.oneSkip + 1; commit(true); }
  else if ((event.key === "Enter" || event.key === " ") && focused && focused !== document.body && stage.contains(focused) && focused.tagName !== "BUTTON") { event.preventDefault(); focused.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
  else if (event.key.toLowerCase() === "w" && id === "one") show(0);
  else if (/^[1-9]$/.test(event.key)) show(Number(event.key) - 1);
  else if (event.key === "ArrowRight") show(current + 1); else if (event.key === "ArrowLeft") show(current - 1); else if (event.key === "Escape") closePop();
});
window.__errors = []; window.addEventListener("error", e => window.__errors.push(String(e.message)));
syncTools();
show(Math.max(0, CONCEPTS.findIndex(c => "#" + c.id === location.hash)));
</script>
