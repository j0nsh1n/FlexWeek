<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlexWeek</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>FlexWeek</h1>
      <p class="tag">Places homework around school and sports, then explains why something moved.</p>
    </div>
    <label class="demo-pick">
      Demo
      <select id="demo">
        <option value="alex">Alex</option>
        <option value="jordan">Jordan</option>
      </select>
    </label>
  </header>

  <main class="layout">
    <section class="calendar" aria-label="Week calendar">
      <div class="week" id="week"></div>
    </section>
    <aside class="side">
      <h2>Flexible</h2>
      <ul id="flexible"></ul>
      <p class="note">Phase 1: locked blocks on the grid. Solver lands in Phase 2.</p>
    </aside>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
