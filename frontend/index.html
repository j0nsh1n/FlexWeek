<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlexWeek</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/logo.png" width="48" height="48" alt="">
      <div>
        <h1>FlexWeek</h1>
        <p class="tag">Places homework around school and sports, then explains why something moved.</p>
      </div>
    </div>
    <div class="controls">
      <label class="demo-pick">
        Demo
        <select id="demo" aria-label="Choose demo student">
          <option value="alex">Alex</option>
          <option value="jordan">Jordan</option>
        </select>
      </label>
      <button type="button" id="solve">Solve</button>
      <span id="status" class="status" role="status"></span>
    </div>
  </header>

  <main class="layout">
    <section class="calendar" aria-label="Week calendar">
      <div class="week" id="week"></div>
    </section>
    <aside class="side">
      <h2>Flexible tasks</h2>
      <p class="note" id="flex-note">Press Solve to place these around school and sports.</p>
      <ul id="flexible"></ul>
      <section id="debug" class="debug" hidden>
        <h2>Debug</h2>
        <p id="debug-stats"></p>
        <ul id="debug-unplaced"></ul>
      </section>
    </aside>
  </main>
  <footer class="foot">Congressional App Challenge 2026 · GPL-3.0</footer>
  <script src="/static/app.js"></script>
</body>
</html>
