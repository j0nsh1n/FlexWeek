[package]
name = "flexweek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
# The name the 1.x updater and installers look for (upgrade.md section 3).
name = "FlexWeek"
path = "src/main.rs"

[dependencies]
flexweek-engine = { path = "../engine" }
flexweek-platform = { path = "../platform" }
flexweek-service = { path = "../service" }
flexweek-store = { path = "../store" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }

[dev-dependencies]
flexweek-testkit = { path = "../testkit" }
rusqlite = { version = "0.37.0", features = ["bundled"] }
