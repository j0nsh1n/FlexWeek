name: Developer build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  dev-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Stamp developer version and channel
        run: |
          BASE=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' desktop/native/version.py)
          if [[ -z "$BASE" ]]; then
            echo "Could not extract base version from desktop/native/version.py" >&2
            exit 1
          fi
          DEVVERSION="${BASE}.$(date -u +%Y%m%d%H%M)"
          sed -i "s/^VERSION = \".*\"/VERSION = \"$DEVVERSION\"/" desktop/native/version.py
          sed -i 's/^CHANNEL = "release"/CHANNEL = "dev"/' desktop/native/version.py
          grep -q "VERSION = \"$DEVVERSION\"" desktop/native/version.py
          grep -q 'CHANNEL = "dev"' desktop/native/version.py
          echo "DEVVERSION=$DEVVERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install bundle tools and xcb helpers to vendor
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            patchelf binutils ccache libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxkbcommon0 libxkbcommon-x11-0 xvfb \
            libegl1 libgl1 libopengl0 libglx0 libgles2 libgl1-mesa-dri

      - name: Create venv and install build + runtime deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
          key: engine-build-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock') }}
          restore-keys: |
            engine-build-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/Nuitka
            ~/.ccache
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-desktop.txt') }}-${{ hashFiles('desktop/**') }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-desktop.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Build the engine module
        run: .venv/bin/python -m maturin develop --release --manifest-path engine/py/Cargo.toml

      - name: Build and package Linux onedir
        run: |
          export NUITKA_CACHE_DIR="${HOME}/.cache/Nuitka"
          export CCACHE_DIR="${HOME}/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p "$NUITKA_CACHE_DIR" "$CCACHE_DIR"
          ./desktop/build_linux.sh
          ./desktop/package_linux.sh dist/FlexWeek dist/release

      - name: Smoke the packaged archive
        # Prove the download itself starts: extract the tarball a user gets and
        # run the root launcher, not the raw onedir. --smoke-test walks a new
        # account through setup to its first Solve and fails on a blank window.
        env:
          QT_QPA_PLATFORM: offscreen
          LD_LIBRARY_PATH: ""
        run: |
          mkdir dist/stage
          tar -xzf dist/release/FlexWeek-Linux-x86_64.tar.gz -C dist/stage
          if find dist/stage/FlexWeek dist/FlexWeek -name '*WebEngineCore*' | grep -q .; then
            echo "Native package must not ship WebEngine" >&2
            exit 1
          fi
          xvfb-run -a -s "-screen 0 1280x800x24" dist/stage/FlexWeek/FlexWeek --smoke-test dist/packaged-smoke.json
          python -c 'import json,sys; r=json.load(open("dist/packaged-smoke.json")); print(r); sys.exit(0 if r.get("ok") and r.get("stage") == "week shown after setup Solve" else 1)'

      - name: Smoke the packaged helper in the archive
        # The download must carry the assistant helper and answer a read-only
        # request from it: the extracted launcher's --mcp dispatch, the seven
        # read tools and the sign-in refusal. A release is not done without it
        # (spec.md, Releases).
        run: |
          python desktop/smoke_mcp.py dist/stage/FlexWeek/FlexWeek --timeout 60

      - name: Check the checksum files
        # Each .sha256 names only its file, so `sha256sum -c` works in whatever
        # folder the user downloaded to.
        working-directory: dist/release
        run: |
          cat FlexWeek-Linux-x86_64.tar.gz.sha256
          if grep -q "/" FlexWeek-Linux-x86_64.tar.gz.sha256; then
            echo "A checksum file names a directory (such as /home/runner), not just the file." >&2
            exit 1
          fi
          sha256sum -c FlexWeek-Linux-x86_64.tar.gz.sha256

      - name: Publish developer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The build being replaced stays downloadable as dev-<its commit>, a pre-release that is
          # never latest, so the updater (which reads only the dev tag and the latest release) never
          # offers it. dev is deleted only once that copy is published with both files; anything
          # unexpected stops the job first, so a build is never lost.
          if old_name=$(gh release view dev --json name --jq .name 2>/dev/null); then
            old_version=${old_name#Developer build }
            old_version=${old_version%% (*}
            if ! [[ "$old_version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
              echo "The dev release is titled '$old_name', not 'Developer build <version>': not replacing it." >&2
              exit 1
            fi
            old_sha=$(git ls-remote origin refs/tags/dev | cut -f1)
            if ! [[ "$old_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The dev tag's commit could not be read ('$old_sha'): not replacing it." >&2
              exit 1
            fi
            kept="dev-${old_sha:0:7}"
            assets='["FlexWeek-Linux-x86_64.tar.gz","FlexWeek-Linux-x86_64.tar.gz.sha256"]'
            have=$(gh release view "$kept" --json isDraft,assets \
              --jq '[.isDraft, ([.assets[].name] | sort)] | tostring' 2>/dev/null || true)
            if [ "$have" != "[false,$assets]" ]; then
              # Missing or half made by an earlier run: make it again from the dev release.
              gh release delete "$kept" --cleanup-tag --yes 2>/dev/null || true
              rm -rf previous-dev && mkdir -p previous-dev
              gh release download dev --dir previous-dev
              # The tag points at this run's commit, not the old build's: once main's workflows have
              # changed, GitHub refuses the workflow token a new tag on an older commit (HTTP 403,
              # 2026-11-06). The old commit stays in the tag's name, the title and the notes.
              gh release create "$kept" previous-dev/* \
                --prerelease \
                --latest=false \
                --target "$(git rev-parse HEAD)" \
                --title "Developer build $old_version (${old_sha:0:7})" \
                --notes "An earlier developer build, built from $old_sha, kept when Developer build $DEVVERSION replaced it. The updater does not offer it."
              have=$(gh release view "$kept" --json isDraft,assets \
                --jq '[.isDraft, ([.assets[].name] | sort)] | tostring')
              if [ "$have" != "[false,$assets]" ]; then
                echo "Keeping $kept did not finish ($have): not replacing dev." >&2
                exit 1
              fi
            fi
          fi
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev \
            dist/release/FlexWeek-Linux-x86_64.tar.gz \
            dist/release/FlexWeek-Linux-x86_64.tar.gz.sha256 \
            --prerelease \
            --latest=false \
            --target "$(git rev-parse HEAD)" \
            --title "Developer build $DEVVERSION" \
            --notes "Developer build $DEVVERSION from main $(git rev-parse --short HEAD). It can have bugs. Turn on Settings → Computer → Get developer builds to get these."
