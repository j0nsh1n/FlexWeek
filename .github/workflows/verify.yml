name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
            tools/fwtest/target
          key: engine-build-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'tools/fwtest/Cargo.lock') }}
          restore-keys: |
            engine-build-${{ runner.os }}-
      - name: Install maturin
        run: python -m pip install maturin==1.15.0
      - name: Build the engine wheel
        # Straight into a fresh folder outside the cached target directory, so an older wheel
        # restored with the cache can never be the one uploaded.
        run: |
          rm -rf dist/engine
          python -m maturin build --release -m engine/py/Cargo.toml --features audit --out dist/engine
          wheels=(dist/engine/*.whl)
          if (( ${#wheels[@]} != 1 )) || [ ! -f "${wheels[0]}" ]; then
            echo "expected exactly one fresh engine wheel, got: ${wheels[*]}" >&2
            exit 1
          fi
      - name: Build fwtest
        working-directory: tools/fwtest
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: fwtest
          path: tools/fwtest/target/release/fwtest
          if-no-files-found: error

  verify-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # fwtest's own tests run Python (fake gates, mutation fixtures) and read git history, as the
      # single verify job gave them before it was split.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            tools/fwtest/target
            engine/target
          key: verify-engine-${{ runner.os }}-${{ hashFiles('tools/fwtest/Cargo.lock', 'engine/Cargo.lock') }}
          restore-keys: |
            verify-engine-${{ runner.os }}-
      - name: fwtest format
        working-directory: tools/fwtest
        run: cargo fmt --check
      - name: fwtest lint
        working-directory: tools/fwtest
        run: cargo clippy -- -D warnings
      - name: fwtest tests
        working-directory: tools/fwtest
        run: cargo test
      - name: engine format
        working-directory: engine
        run: cargo fmt --check
      - name: engine lint
        working-directory: engine
        run: cargo clippy --workspace -- -D warnings
      - name: engine tests
        working-directory: engine
        run: cargo test --workspace

  verify-python:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - uses: actions/download-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine
      - uses: actions/download-artifact@v7
        with:
          name: fwtest
          path: dist/fwtest
      - name: Install the engine wheel and fwtest
        run: |
          chmod +x dist/fwtest/fwtest
          echo "$PWD/dist/fwtest" >> "$GITHUB_PATH"
          python -m pip install dist/engine/*.whl
      # Lint, types, the mutation patterns, the backend tests and the diff checks. The desktop
      # tests run in the desktop job's shards.
      - run: fwtest gate --backend-only
        env:
          VERIFY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          # The replay of recorded solves against the original Python solver takes about two
          # minutes on one worker locally and over six here, which ran the default 480 s out.
          FWTEST_STEP_TIMEOUT_SECS: "900"
          FLEXWEEK_SILENT: "1"
          FWTEST_FLAKY_LOG: ${{ github.workspace }}/flaky/flaky.jsonl
      - name: Upload the flaky-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-verify-python
          path: flaky/
          if-no-files-found: ignore
          retention-days: 30

  desktop:
    # The whole desktop suite and the rig's own Python tests, offscreen, split by test file
    # over four jobs. About 4,800 s of test time in all: roughly 10 to 15 minutes per shard.
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt
      - name: Install Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - uses: actions/download-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine
      - uses: actions/download-artifact@v7
        with:
          name: fwtest
          path: dist/fwtest
      - name: Install the engine wheel and fwtest
        run: |
          chmod +x dist/fwtest/fwtest
          echo "$PWD/dist/fwtest" >> "$GITHUB_PATH"
          python -m pip install dist/engine/*.whl
      - name: Desktop tests, shard ${{ matrix.shard }} of 4
        env:
          QT_QPA_PLATFORM: offscreen
          FLEXWEEK_SILENT: "1"
          FWTEST_FLAKY_LOG: ${{ github.workspace }}/flaky/flaky.jsonl
          SHARD: ${{ matrix.shard }}
        # Every test file under desktop/tests and scripts/rig, sorted, dealt out in turn. A
        # failed test is rerun alone once; a pass alone is logged as flaky and does not fail.
        run: |
          mapfile -t files < <(git ls-files -- 'desktop/tests/*.py' 'scripts/rig/*.py' \
            | grep -E '/test_[^/]*\.py$' | sort | awk -v k="$SHARD" 'NR % 4 == k % 4')
          if (( ${#files[@]} == 0 )); then
            echo "shard $SHARD has no test files" >&2
            exit 1
          fi
          echo "shard $SHARD: ${#files[@]} files"
          fwtest run --timeout 2400 -- .venv/bin/python -m pytest -q -p no:cacheprovider -n 4 "${files[@]}"
      - name: Upload the flaky-test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-desktop-${{ matrix.shard }}
          path: flaky/
          if-no-files-found: ignore
          retention-days: 30

  rig:
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tab: [day, week]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install display and Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool x11-utils \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - uses: actions/download-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine
      - uses: actions/download-artifact@v7
        with:
          name: fwtest
          path: dist/fwtest
      - name: Install the engine wheel and fwtest
        run: |
          chmod +x dist/fwtest/fwtest
          echo "$PWD/dist/fwtest" >> "$GITHUB_PATH"
          python -m pip install dist/engine/*.whl
      - name: Run classic ${{ matrix.tab }} with a real pointer
        run: |
          fwtest rig --server xvfb --design classic --tab ${{ matrix.tab }} --out rig-artifacts/${{ matrix.tab }}
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tab = os.environ["TAB"]
          results = json.loads((Path("rig-artifacts") / tab / "results.json").read_text())
          if not results:
              raise SystemExit(f"Classic {tab} rig selected no scenarios")
          PY
        env:
          TAB: ${{ matrix.tab }}
          FLEXWEEK_SILENT: "1"
      - name: Stop the hidden display
        if: always()
        run: fwtest clean
      - name: Upload rig results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: classic-rig-${{ matrix.tab }}
          path: rig-artifacts/${{ matrix.tab }}/
          if-no-files-found: warn
          retention-days: 7

  mutate:
    # The mutation cases whose rule is in the engine, on every pull request (CI is the gate,
    # spec.md Testing structure rule 7) and by hand.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install Qt libraries
        # PySide6 cannot load without libEGL; the desktop tests would then fail to import and
        # fwtest would count every mutation they name as caught.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - name: Make the checkout's .venv
        # A real virtualenv, not a link to the runner's Python: fwtest rebuilds each mutated engine
        # with `.venv/bin/maturin develop`, which needs maturin there and a virtualenv to install into.
        # 29 of the engine cases name desktop tests. Without PySide6 those tests cannot even
        # import, pytest exits red, and fwtest would count every mutation as caught.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            engine/target
            tools/fwtest/target
          key: mutate-engine-${{ runner.os }}-shard${{ matrix.shard }}-${{ hashFiles('engine/Cargo.lock', 'engine/**/*.rs', 'engine/**/Cargo.toml') }}
          restore-keys: |
            mutate-engine-${{ runner.os }}-shard${{ matrix.shard }}-
            mutate-engine-${{ runner.os }}-
      - name: Build fwtest
        working-directory: tools/fwtest
        run: |
          cargo build --release
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Build the engine module
        run: .venv/bin/maturin develop --profile mutant --manifest-path engine/py/Cargo.toml --features audit
      - name: Mutation cases whose rule is in the engine
        env:
          QT_QPA_PLATFORM: offscreen
          FLEXWEEK_SILENT: "1"
          FWTEST_ENGINE_PROFILE: mutant
        run: fwtest mutate --engine-only --shard ${{ matrix.shard }}/4

  mutate-python:
    # The mutation cases whose rule is in Python (about 500), on every pull request and by
    # hand, against the engine wheel the engine job built. Split over six jobs: each case runs
    # one test, so roughly 10 to 15 minutes per shard.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt
      - name: Install Qt libraries
        # Without libEGL the desktop tests cannot import, pytest exits red, and fwtest would
        # count every mutation they name as caught.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3
      - uses: actions/download-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine
      - uses: actions/download-artifact@v7
        with:
          name: fwtest
          path: dist/fwtest
      - name: Make the checkout's .venv with the engine wheel, and install fwtest
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
          .venv/bin/python -m pip install dist/engine/*.whl
          chmod +x dist/fwtest/fwtest
          echo "$PWD/dist/fwtest" >> "$GITHUB_PATH"
      - name: Keep only the cases whose file is outside engine/
        # fwtest mutate has --engine-only but no opposite; these copies hold the rest, in the
        # same spec-then-case order, so the shards split them the same way every run.
        run: |
          mkdir -p "$RUNNER_TEMP/python-mutations"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "python-mutations"
          total = 0
          for spec in sorted(Path("scripts/mutations").glob("*.json")):
              cases = [c for c in json.loads(spec.read_text()) if Path(c["file"]).parts[0] != "engine"]
              if cases:
                  (out / spec.name).write_text(json.dumps(cases, indent=2))
                  total += len(cases)
          if total == 0:
              raise SystemExit("no Python mutation cases found")
          print(f"{total} Python mutation cases")
          PY
      - name: Python mutation cases, shard ${{ matrix.shard }} of 6
        env:
          QT_QPA_PLATFORM: offscreen
          FLEXWEEK_SILENT: "1"
          FWTEST_ENGINE_REBUILD: "off"
        run: fwtest mutate --shard ${{ matrix.shard }}/6 "$RUNNER_TEMP"/python-mutations/*.json

  pictures:
    # Pull requests only (spec.md, Testing structure rule 6): the screens this pull request's changed
    # files touch, drawn from the base and from the pull request, compared, and the review page
    # uploaded. The artifact is deleted when the pull request closes (pictures-cleanup.yml); no
    # reference pictures are stored. No reviewer model runs here.
    if: github.event_name == 'pull_request'
    needs: engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3 fontconfig
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt PySide6==6.11.2
      - name: Point .venv at the runner's Python
        run: |
          mkdir -p .venv/bin
          ln -s "$pythonLocation/bin/python" .venv/bin/python
      - uses: actions/download-artifact@v7
        with:
          name: engine-wheel
          path: dist/engine
      - uses: actions/download-artifact@v7
        with:
          name: fwtest
          path: dist/fwtest
      - name: Install the engine wheel and fwtest
        run: |
          chmod +x dist/fwtest/fwtest
          echo "$PWD/dist/fwtest" >> "$GITHUB_PATH"
          python -m pip install dist/engine/*.whl
      - name: Draw the touched screens on the base and on this pull request
        id: render
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: fwtest pictures render --set touched --base "$BASE_SHA" --out pictures-run
      - name: Compare the two drawings
        id: compare
        if: always() && hashFiles('pictures-run/head/index.json') != '' && hashFiles('pictures-run/base/index.json') != ''
        continue-on-error: true
        run: fwtest pictures compare pictures-run/base pictures-run/head --out pictures-run/compare
      - name: Build the review page
        if: always() && hashFiles('pictures-run/compare/compare.json') != ''
        run: fwtest pictures page pictures-run/compare
      - name: Upload the review page
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pictures-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: pictures-run/compare/
          if-no-files-found: warn
          # The most GitHub keeps; pictures-cleanup.yml deletes it when the pull request closes.
          retention-days: 90
      - name: Fail when a screen could not be drawn or compared
        if: steps.render.outcome == 'failure' || steps.compare.outcome == 'failure'
        run: |
          echo "A screen could not be drawn or compared: see the review page artifact." >&2
          exit 1
