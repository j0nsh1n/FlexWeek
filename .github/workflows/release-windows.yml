name: Release — Windows package

# Builds the Windows onedir package (Nuitka can only build for the OS it runs
# on) and attaches a zip to the GitHub release. Fires automatically when a
# release is published; also runnable by hand against an existing tag.
#
# onedir (not onefile): Qt WebEngine cannot be statically linked, so the
# bundle ships as a zip of the whole folder — see DESKTOP.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the Windows zip to (e.g. v0.7.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build + runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Build Windows onedir package
        run: ./desktop/build_windows.ps1
        shell: pwsh

      - name: Smoke-test package layout
        # --windows-console-mode=disable freezes have no console; assert the
        # freeze layout is complete. A missing frontend data dir means the
        # --include-data-dir flag was dropped and the window would show only
        # the native retry panel.
        run: |
          $root = "dist\FlexWeek-Windows"
          $exe = Join-Path $root "FlexWeek.exe"
          if (-not (Test-Path $exe)) { throw "FlexWeek.exe missing after build" }
          if (-not (Test-Path (Join-Path $root "frontend\index.html"))) {
            throw "frontend data dir missing under $root — bundled UI would not load"
          }
          if (-not (Get-ChildItem -Path $root -Recurse -Filter "QtWebEngineCore.dll" -ErrorAction SilentlyContinue)) {
            throw "QtWebEngineCore.dll missing under $root — WebEngine will not start"
          }
          Write-Host "Built: $exe"
          Get-ChildItem $root | Select-Object Name, Length

      - name: Zip the bundle
        run: |
          Compress-Archive -Path dist\FlexWeek-Windows `
            -DestinationPath dist\FlexWeek-win64.zip -Force
          $hash = (Get-FileHash dist\FlexWeek-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  FlexWeek-win64.zip" | Set-Content -NoNewline dist\FlexWeek-win64.zip.sha256
          Write-Host "SHA256: $hash"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release upload "$env:TAG" `
            dist\FlexWeek-win64.zip `
            dist\FlexWeek-win64.zip.sha256 `
            --clobber
