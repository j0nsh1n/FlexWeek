# Deletes a pull request's review pictures (verify.yml, job pictures) once it is merged or closed:
# spec.md, Testing structure rule 6, keeps pictures and videos only until then.
# pull_request_target gives the token the right to delete for pull requests from forks too. Nothing
# from the pull request is checked out or run here.
name: Pictures cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete this pull request's pictures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: pictures-pr-${{ github.event.pull_request.number }}-
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith(env.PREFIX)) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
            echo "Deleted artifact $id"
          done
